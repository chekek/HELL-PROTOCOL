<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>БЕССОННИЦА — лабиринт, из которого не выходят</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e02414; --ink:#14120f; --paper:#e8e2d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#d8d2c2;
    font-family:'IBM Plex Mono',monospace;cursor:crosshair;user-select:none}
  canvas{display:block}

  /* рамка-видоискатель */
  #frame{position:fixed;inset:14px;border:1px solid rgba(20,18,15,.28);pointer-events:none;z-index:5}
  #frame::before,#frame::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--ink)}
  #frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
  #frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none}

  /* прицел */
  #crosshair{position:fixed;left:50%;top:50%;width:0;height:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
  body.playing #crosshair{opacity:1}
  #crosshair span{position:absolute;background:var(--ink)}
  #crosshair .c1{width:2px;height:7px;left:-1px;top:-13px}
  #crosshair .c2{width:2px;height:7px;left:-1px;top:6px}
  #crosshair .c3{width:7px;height:2px;left:-13px;top:-1px}
  #crosshair .c4{width:7px;height:2px;left:6px;top:-1px}
  #crosshair.hit span{background:var(--red)}
  #crosshair.hit{animation:hitmk .14s ease-out}
  @keyframes hitmk{0%{transform:scale(1.6)}100%{transform:scale(1)}}

  /* виньетка и вспышка урона */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at center,transparent 62%,rgba(10,8,6,.42) 100%)}
  #damage{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;
    background:radial-gradient(ellipse at center,transparent 42%,rgba(224,36,20,.55) 100%)}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:6;color:var(--ink);
    text-transform:uppercase;letter-spacing:.14em;font-size:13px;opacity:0;transition:opacity .3s}
  body.playing #hud{opacity:1}
  #hud-tl{position:absolute;top:34px;left:38px;line-height:1.9}
  #hud-tl b{font-weight:700}
  .dim{opacity:.55}
  #hud-bl{position:absolute;bottom:34px;left:38px}
  #hp-num{font-family:'Unbounded';font-weight:900;font-size:44px;line-height:1;letter-spacing:.02em}
  #hp-num.low{color:var(--red)}
  #hp-bar{width:180px;height:4px;background:rgba(20,18,15,.18);margin-top:8px}
  #hp-fill{height:100%;background:var(--ink);width:100%}
  #hp-fill.low{background:var(--red)}
  #hud-br{position:absolute;bottom:34px;right:38px;text-align:right}
  #wpn-name{font-size:12px;letter-spacing:.28em;margin-bottom:4px}
  #ammo{font-family:'Unbounded';font-weight:700;font-size:38px;line-height:1}
  #ammo .sep{opacity:.35;font-weight:400;margin:0 4px}
  #ammo .mag{font-size:18px;opacity:.5}
  #reload-tag{font-size:11px;color:var(--red);letter-spacing:.3em;height:14px;margin-top:4px;
    animation:blink .5s steps(2) infinite}
  @keyframes blink{to{opacity:.15}}
  #hint{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:.3em;opacity:.6;transition:opacity 1.2s}

  /* оверлеи */
  #overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(232,226,212,.9);backdrop-filter:blur(6px);color:var(--ink);text-align:center;
    transition:opacity .5s;cursor:pointer}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay .box{max-width:640px;padding:40px}
  #overlay h1{font-family:'Unbounded';font-weight:900;font-size:58px;letter-spacing:.04em;line-height:1}
  #overlay h1 em{font-style:normal;color:var(--red)}
  #overlay .sub{margin-top:14px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
  #overlay .ctrl{margin-top:34px;font-size:12.5px;line-height:2.1;letter-spacing:.1em;text-transform:uppercase;
    border-top:1px solid rgba(20,18,15,.25);border-bottom:1px solid rgba(20,18,15,.25);padding:16px 0}
  #overlay .ctrl b{display:inline-block;min-width:170px;font-weight:700}
  #overlay .go{margin-top:36px;font-family:'Unbounded';font-weight:700;font-size:15px;
    letter-spacing:.24em;color:var(--red);animation:blink 1.1s steps(2) infinite}
  #overlay .quote{margin-top:26px;font-size:12px;letter-spacing:.18em;opacity:.55;text-transform:lowercase}
  #overlay .stat{margin-top:22px;font-size:14px;letter-spacing:.2em;line-height:2}
  #overlay .stat b{color:var(--red)}
  #lvl-frag{color:var(--red)}
</style>
</head>
<body>
<div id="frame"></div>
<div id="crosshair"><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span></div>
<div id="vignette"></div>
<div id="damage"></div>

<div id="hud">
  <div id="hud-tl">
    <div>глубина <b id="ui-depth">01</b></div>
    <div>счёт <b id="ui-score">0</b></div>
    <div class="dim">уничтожено <b id="ui-kills">0</b></div>
  </div>
  <div id="hud-bl">
    <div id="hp-num">100</div>
    <div id="hp-bar"><div id="hp-fill"></div></div>
  </div>
  <div id="hud-br">
    <div id="wpn-name">Револьвер</div>
    <div id="ammo"><span id="ammo-cur">6</span><span class="sep">/</span><span class="mag" id="ammo-mag">6</span></div>
    <div id="reload-tag"></div>
  </div>
  <div id="hint">найди белый столб света — он ведёт глубже</div>
</div>

<div id="overlay"><div class="box" id="overlay-box"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   БЕССОННИЦА — сюрреалистичный FPS в одном файле
   ============================================================ */

// ---------- константы ----------
const CS = 4;            // размер клетки лабиринта
const WALL_H = 5;        // высота стен
const EYE = 1.7, PLAYER_R = 0.55;
const WALK = 8.2, RUN = 12.4, JUMP = 7, GRAV = 22;
const RED = 0xe02414, INK = 0x14120f, PAPER = 0xe8e2d4;

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));

// ---------- звук: чистый WebAudio, всё синтезируется ----------
let AC=null, master=null, noiseBuf=null, droneNodes=null;
function initAudio(){
  if(AC){ AC.resume(); return; }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.42; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  // фоновый дрон — гудение сна
  const g=AC.createGain(); g.gain.value=0.05; g.connect(master);
  [55,55.7,110.4].forEach((f,i)=>{
    const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f;
    const og=AC.createGain(); og.gain.value=i===2?0.25:1;
    o.connect(og); og.connect(g); o.start();
  });
  const lfo=AC.createOscillator(); lfo.frequency.value=0.09;
  const lg=AC.createGain(); lg.gain.value=0.022;
  lfo.connect(lg); lg.connect(g.gain); lfo.start();
}
function sNoise(dur,vol,freq,type,q,delay){
  if(!AC) return;
  const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq; f.Q.value=q||1;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+dur+0.05);
}
function sTone(dur,vol,f0,f1,type,delay){
  if(!AC) return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.05);
}
const SFX = {
  rev(){ sNoise(0.16,0.5,2200,'bandpass',0.6); sTone(0.16,0.3,170,55,'triangle'); },
  shotgun(){ sNoise(0.32,0.75,950,'lowpass',0.8); sTone(0.28,0.45,110,32,'triangle'); sNoise(0.1,0.3,3000,'highpass',1); },
  rocket(){ sNoise(0.45,0.5,650,'lowpass',1); sTone(0.4,0.25,320,70,'sawtooth'); },
  boom(){ sNoise(0.9,0.9,380,'lowpass',0.7); sTone(0.7,0.6,95,26,'sine'); sNoise(0.25,0.4,2000,'highpass',1,0.03); },
  zap(v){ sTone(0.12,(v||0.3),1500,160,'square'); sNoise(0.1,(v||0.3)*0.7,4000,'highpass',1); },
  hit(){ sTone(0.05,0.22,950,700,'square'); },
  hurt(){ sTone(0.28,0.4,130,60,'sawtooth'); sNoise(0.2,0.3,500,'lowpass',1); },
  kill(){ sTone(0.2,0.3,300,90,'triangle'); sNoise(0.25,0.35,900,'bandpass',1.5); },
  click(){ sNoise(0.04,0.25,2600,'bandpass',4); },
  reload(){ sNoise(0.05,0.3,2400,'bandpass',5); sNoise(0.06,0.3,1800,'bandpass',5,0.28); },
  step(){ sNoise(0.06,0.09,420,'lowpass',1); },
  pickup(){ sTone(0.18,0.25,620,1240,'sine'); sTone(0.18,0.12,930,1860,'sine',0.02); },
  portal(){ sTone(0.7,0.3,240,960,'sine'); sTone(0.7,0.15,360,1440,'sine',0.1); },
  dry(){ sNoise(0.05,0.2,1400,'bandpass',6); },
};
function chargeSound(on,e){
  if(!AC) return;
  if(on){
    const o=AC.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(160,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(980,AC.currentTime+0.85);
    const g=AC.createGain(); g.gain.value=0.0001;
    g.gain.linearRampToValueAtTime(0.07,AC.currentTime+0.15);
    o.connect(g); g.connect(master); o.start();
    e.osc={o,g};
  } else if(e.osc){
    try{ e.osc.g.gain.setTargetAtTime(0.0001,AC.currentTime,0.03); e.osc.o.stop(AC.currentTime+0.15);}catch(err){}
    e.osc=null;
  }
}

// ---------- сцена ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xded7c6);
scene.fog = new THREE.Fog(0xded7c6, 18, 82);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 600);
camera.rotation.order = 'YXZ';
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xfff6e6, 0x8f887a, 0.95));
const sunLight = new THREE.DirectionalLight(0xfff2dd, 0.5);
sunLight.position.set(-40, 60, -90);
scene.add(sunLight);

// чёрное солнце — бесконечно удалённый объект
const SUNDIR = new THREE.Vector3(-0.32,0.42,-0.85).normalize();
const blackSun = new THREE.Mesh(
  new THREE.CircleGeometry(30,48),
  new THREE.MeshBasicMaterial({color:0x0c0a08, fog:false})
);
scene.add(blackSun);

// процедурные текстуры
function makeCheckerTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  x.fillStyle='#d9d2c0'; x.fillRect(0,0,128,128);
  x.fillStyle='#191611'; x.fillRect(0,0,64,64); x.fillRect(64,64,64,64);
  x.strokeStyle='rgba(20,18,15,.25)'; x.lineWidth=1;
  x.strokeRect(0.5,0.5,127,127);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.magFilter=THREE.NearestFilter;
  return t;
}
function makeWallTex(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#e9e3d3'; x.fillRect(0,0,256,256);
  x.strokeStyle='rgba(22,19,14,.16)'; x.lineWidth=2;
  for(let i=0;i<9;i++){ // тонкие вертикальные штрихи — «нарезанный» сон
    const px=18+i*28+rnd(-4,4);
    x.beginPath(); x.moveTo(px,rnd(10,40)); x.lineTo(px+rnd(-6,6),256-rnd(10,40)); x.stroke();
  }
  x.strokeStyle='#16130e'; x.lineWidth=10;
  x.strokeRect(0,0,256,256); // чёрные рёбра блоков
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
const checkerTex = makeCheckerTex(), wallTex = makeWallTex();

const wallGeo = new THREE.BoxGeometry(CS,WALL_H,CS);
const wallMat = new THREE.MeshLambertMaterial({map:wallTex});
const floorMat = new THREE.MeshLambertMaterial({map:checkerTex});

// ---------- состояние игры ----------
let state='menu';           // menu | playing | paused | dead | transition
let pendingState=null;
let locked=false;
let maze=null, levelGroup=null, wallMesh=null, exitPos=new THREE.Vector3();
let depth=1, score=0, kills=0, bestDepth=1;
let gameT=0;

const player = { pos:new THREE.Vector3(), vel:new THREE.Vector3(),
  hp:100, onGround:true, yaw:0, pitch:0, lastHurt:-99, bob:0, stepAcc:0 };
let shake=0, dmgFlash=0;

const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space') e.preventDefault();
  if(state!=='playing') return;
  if(e.code==='KeyR') startReload();
  if(e.code==='Digit1') switchWeapon(0);
  if(e.code==='Digit2') switchWeapon(1);
  if(e.code==='Digit3') switchWeapon(2);
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('wheel',e=>{ if(state==='playing') switchWeapon((curW+(e.deltaY>0?1:2))%3); });

document.addEventListener('mousemove',e=>{
  if(!locked||state!=='playing') return;
  player.yaw   -= e.movementX*0.0022;
  player.pitch  = clamp(player.pitch - e.movementY*0.0022, -1.5, 1.5);
});
document.addEventListener('mousedown',e=>{
  if(locked && state==='playing' && e.button===0) tryFire();
});

// pointer lock ----------
const cv = renderer.domElement;
document.addEventListener('pointerlockchange',()=>{
  locked = document.pointerLockElement===cv;
  if(locked && pendingState){
    state = pendingState; pendingState=null;
    overlay.classList.add('hidden');
    document.body.classList.add('playing');
  } else if(!locked && (state==='playing'||state==='transition')){
    if(state==='playing'){ state='paused'; showPause(); }
  }
});
overlayShow('');

function overlayShow(html){ document.getElementById('overlay-box').innerHTML=html;
  document.getElementById('overlay').classList.remove('hidden'); }

const QUOTES = [
  '«стены повторяются. или это ты повторяешься.»',
  '«здесь нет выхода. есть только глубина.»',
  '«чёрное солнце не греет. оно смотрит.»',
  '«фигуры помнят тебя с прошлого сна.»',
  '«патроны бесконечны. ты — нет.»',
  '«не считай повороты. они считают тебя.»',
  '«свет сквозь стены — единственная честная вещь здесь.»',
];

function showIntro(){
  overlayShow(`
    <h1>БЕССОН<em>НИЦА</em></h1>
    <div class="sub">шутер про лабиринт, из которого не выходят</div>
    <div class="ctrl">
      <b>WASD / мышь</b> движение и обзор<br>
      <b>ЛКМ</b> огонь &nbsp;·&nbsp; <b>R</b> перезарядка<br>
      <b>1 / 2 / 3 / колесо</b> револьвер · двухстволка · ракетница<br>
      <b>SHIFT / SPACE</b> бег / прыжок
    </div>
    <div class="quote">геометрия не любит тебя. красная геометрия — особенно.<br>белый столб света ведёт глубже. гильзы бесконечны — сон тоже.</div>
    <div class="go">[ щёлкни, чтобы уснуть ]</div>`);
}
function showPause(){
  overlayShow(`<h1>ПАУЗА</h1><div class="sub">сон ждёт</div>
    <div class="quote">фигуры стоят неподвижно. пока что.</div>
    <div class="go">[ щёлкни, чтобы вернуться ]</div>`);
  document.body.classList.remove('playing');
}
function showDeath(){
  overlayShow(`
    <h1>ПРОБУЖДЕНИЕ<br><em>ОТМЕНЕНО</em></h1>
    <div class="stat">глубина <b>${String(depth).padStart(2,'0')}</b> · счёт <b>${score}</b> · уничтожено <b>${kills}</b><br>
    лучшая глубина за сессию <b>${String(bestDepth).padStart(2,'0')}</b></div>
    <div class="quote">${QUOTES[rndi(0,QUOTES.length-1)]}</div>
    <div class="go">[ щёлкни, чтобы уснуть снова ]</div>`);
  document.body.classList.remove('playing');
}
function showTransition(){
  overlayShow(`
    <h1 style="font-size:44px">ГЛУБЖЕ <em>${String(depth+1).padStart(2,'0')}</em></h1>
    <div class="quote">${QUOTES[rndi(0,QUOTES.length-1)]}</div>`);
  document.getElementById('overlay').classList.remove('hidden');
  setTimeout(()=>{ if(state==='transition') document.getElementById('overlay').classList.add('hidden'); },1300);
}

document.getElementById('overlay').addEventListener('click',()=>{
  initAudio();
  if(state==='menu'||state==='dead'){
    if(state==='dead'){ score=0; kills=0; depth=1; }
    buildLevel(depth); resetPlayer();
    pendingState='playing';
    cv.requestPointerLock();
  } else if(state==='paused'){
    pendingState='playing';
    cv.requestPointerLock();
  }
});
showIntro();

// ---------- лабиринт ----------
function generateMaze(n){
  const W=n*2+1, H=n*2+1;
  const g=Array.from({length:H},()=>new Array(W).fill(1));
  const stack=[[0,0]]; g[1][1]=0;
  while(stack.length){
    const [cx,cy]=stack[stack.length-1];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-0.5);
    let carved=false;
    for(const [dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      if(nx>=0&&ny>=0&&nx<n&&ny<n&&g[ny*2+1][nx*2+1]===1){
        g[cy*2+1+dy][cx*2+1+dx]=0;
        g[ny*2+1][nx*2+1]=0;
        stack.push([nx,ny]); carved=true; break;
      }
    }
    if(!carved) stack.pop();
  }
  // пробиваем петли, чтобы лабиринт дышал
  let extra=Math.floor(n*n*0.16), guard=900;
  while(extra>0&&guard-->0){
    const x=rndi(1,W-2), y=rndi(1,H-2);
    if(g[y][x]!==1) continue;
    const h=g[y][x-1]===0&&g[y][x+1]===0;
    const v=g[y-1][x]===0&&g[y+1][x]===0;
    if(h!==v){ g[y][x]=0; extra--; }
  }
  return {grid:g,W,H};
}
function isSolid(gx,gz){
  if(!maze||gx<0||gz<0||gx>=maze.W||gz>=maze.H) return true;
  return maze.grid[gz][gx]===1;
}
function collide(x,z,r){
  const gx0=Math.floor((x-r)/CS), gx1=Math.floor((x+r)/CS);
  const gz0=Math.floor((z-r)/CS), gz1=Math.floor((z+r)/CS);
  for(let gz=gz0;gz<=gz1;gz++)for(let gx=gx0;gx<=gx1;gx++){
    if(!isSolid(gx,gz)) continue;
    const cx=clamp(x,gx*CS,(gx+1)*CS), cz=clamp(z,gz*CS,(gz+1)*CS);
    const dx=x-cx, dz=z-cz;
    if(dx*dx+dz*dz<r*r) return true;
  }
  return false;
}
function moveMC(pos,dx,dz,r){
  if(!collide(pos.x+dx,pos.z,r)) pos.x+=dx;
  if(!collide(pos.x,pos.z+dz,r)) pos.z+=dz;
}
function castWall(ox,oz,dx,dz,maxD){ // DDA по сетке, дистанция в XZ-плоскости
  let gx=Math.floor(ox/CS), gz=Math.floor(oz/CS);
  const sx=dx>0?1:-1, sz=dz>0?1:-1;
  const tdx=dx!==0?Math.abs(CS/dx):Infinity;
  const tdz=dz!==0?Math.abs(CS/dz):Infinity;
  let tmx=Infinity,tmz=Infinity;
  if(dx>0)tmx=((gx+1)*CS-ox)/dx; else if(dx<0)tmx=(gx*CS-ox)/dx;
  if(dz>0)tmz=((gz+1)*CS-oz)/dz; else if(dz<0)tmz=(gz*CS-oz)/dz;
  let t=0;
  for(let i=0;i<240;i++){
    if(tmx<tmz){ t=tmx; tmx+=tdx; gx+=sx; } else { t=tmz; tmz+=tdz; gz+=sz; }
    if(t>maxD) return maxD;
    if(isSolid(gx,gz)) return t;
  }
  return maxD;
}
function castWall3D(o,d,maxD){ // учитываем пол
  const l=Math.hypot(d.x,d.z);
  let wall=maxD;
  if(l>1e-4) wall=castWall(o.x,o.z,d.x/l,d.z/l,maxD*l)/l;
  if(d.y<-1e-4){ const tf=o.y/(-d.y); if(tf<wall) wall=tf; }
  return Math.min(wall,maxD);
}
function LOS(ax,az,bx,bz){
  const dx=bx-ax, dz=bz-az, d=Math.hypot(dx,dz);
  if(d<0.001) return true;
  return castWall(ax,az,dx/d,dz/d,d)>=d-0.02;
}
function raySphere(o,d,c,r){
  const ox=o.x-c.x, oy=o.y-c.y, oz=o.z-c.z;
  const b=ox*d.x+oy*d.y+oz*d.z;
  const cc=ox*ox+oy*oy+oz*oz-r*r;
  const disc=b*b-cc;
  if(disc<0) return -1;
  const t=-b-Math.sqrt(disc);
  return t>0?t:-1;
}

// ---------- постройка уровня ----------
const enemies=[], rockets=[], pickups=[], particles=[];
const particleGroup=new THREE.Group(); scene.add(particleGroup);
const eGroup=new THREE.Group(); scene.add(eGroup);

function buildLevel(d){
  // снос прошлого уровня
  if(levelGroup){ scene.remove(levelGroup); }
  enemies.forEach(e=>chargeSound(false,e)); enemies.length=0;
  rockets.length=0; pickups.length=0;
  for(let i=particles.length-1;i>=0;i--) killParticle(i);
  while(eGroup.children.length) eGroup.remove(eGroup.children[0]);

  levelGroup=new THREE.Group(); scene.add(levelGroup);
  const n=8+Math.min(d,7);
  maze=generateMaze(n);

  // пол
  const fw=maze.W*CS, fh=maze.H*CS;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(fw,fh), floorMat.clone());
  floor.material.map=checkerTex.clone();
  floor.material.map.needsUpdate=true;
  floor.material.map.repeat.set(fw/2,fh/2);
  floor.rotation.x=-Math.PI/2;
  floor.position.set(fw/2,0,fh/2);
  levelGroup.add(floor);

  // стены — один InstancedMesh
  const cells=[];
  for(let z=0;z<maze.H;z++)for(let x=0;x<maze.W;x++)
    if(maze.grid[z][x]===1) cells.push([x,z]);
  wallMesh=new THREE.InstancedMesh(wallGeo,wallMat,cells.length);
  const m=new THREE.Matrix4();
  cells.forEach(([x,z],i)=>{
    m.makeTranslation((x+0.5)*CS,WALL_H/2,(z+0.5)*CS);
    wallMesh.setMatrixAt(i,m);
  });
  levelGroup.add(wallMesh);

  // BFS: дистанции от старта + самая дальняя клетка = выход
  const distMap=Array.from({length:maze.H},()=>new Array(maze.W).fill(-1));
  const q=[[1,1]]; distMap[1][1]=0; let far=[1,1],fd=0;
  while(q.length){
    const [x,z]=q.shift();
    for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,nz=z+dz;
      if(nx<0||nz<0||nx>=maze.W||nz>=maze.H) continue;
      if(maze.grid[nz][nx]===0&&distMap[nz][nx]<0){
        distMap[nz][nx]=distMap[z][x]+1;
        if(distMap[nz][nx]>fd){ fd=distMap[nz][nx]; far=[nx,nz]; }
        q.push([nx,nz]);
      }
    }
  }
  exitPos.set((far[0]+0.5)*CS,0,(far[1]+0.5)*CS);

  // столб света — маяк, светящий сквозь стены (сюрреализм + навигация)
  const beacon=new THREE.Mesh(
    new THREE.CylinderGeometry(0.9,0.9,90,20,1,true),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.22,
      depthWrite:false,fog:false,side:THREE.DoubleSide})
  );
  beacon.position.set(exitPos.x,45,exitPos.z);
  beacon.renderOrder=-1;
  levelGroup.add(beacon);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,0.06,8,40),
    new THREE.MeshBasicMaterial({color:0xffffff}));
  ring.rotation.x=Math.PI/2; ring.position.set(exitPos.x,0.08,exitPos.z);
  levelGroup.add(ring);
  levelGroup.userData={beacon,ring};

  // гигантские фигуры в небе — каждый уровень новое небо
  const skyGeos=[new THREE.IcosahedronGeometry(1,1),new THREE.TorusGeometry(1,0.3,8,26),
    new THREE.OctahedronGeometry(1,0),new THREE.TorusKnotGeometry(1,0.25,60,10)];
  for(let i=0;i<9;i++){
    const g=skyGeos[rndi(0,skyGeos.length-1)];
    const mat=new THREE.MeshBasicMaterial({color:i<2?RED:0x17140f,
      wireframe:true,transparent:true,opacity:i<2?0.5:0.32});
    const mesh=new THREE.Mesh(g,mat);
    const a=rnd(0,Math.PI*2), rr=rnd(60,150);
    mesh.position.set(fw/2+Math.cos(a)*rr, rnd(30,95), fh/2+Math.sin(a)*rr);
    mesh.scale.setScalar(rnd(9,26));
    mesh.userData={spin:rnd(0.05,0.25)*(Math.random()<0.5?-1:1)};
    mesh.userData.sky=true;
    levelGroup.add(mesh);
  }

  // спавн врагов
  const spawnCells=[];
  for(let z=1;z<maze.H-1;z++)for(let x=1;x<maze.W-1;x++)
    if(maze.grid[z][x]===0&&distMap[z][x]>=6&&!(x===far[0]&&z===far[1])) spawnCells.push([x,z]);
  spawnCells.sort(()=>Math.random()-0.5);
  const count=Math.min(5+d*2,26);
  for(let i=0;i<count&&i<spawnCells.length;i++){
    const [x,z]=spawnCells[i];
    spawnEnemy((x+0.5)*CS,(z+0.5)*CS,d);
  }
}

function resetPlayer(){
  player.pos.set(1.5*CS,0,1.5*CS);

  player.hp=100; player.pitch=0;

  gunState.forEach(s=>{s.ammo=WEAPONS[s.w].mag; s.reloading=0;});
  curW=0; switchT=0.35; cooldown=0;
  const hint=document.getElementById('hint');
  hint.style.opacity=0.6;

// ---------- враги ----------
const ETYPES={
  TETRA:{geo:new THREE.TetrahedronGeometry(1.05),hp:40, speed:3.6,fireInt:2.7,charge:0.85,dmg:9, range:9, score:10,r:1.0, name:'тетра'},
  OCTA :{geo:new THREE.OctahedronGeometry(1.05), hp:70, speed:2.5,fireInt:2.2,charge:0.85,dmg:13,range:11,score:15,r:1.05,name:'окта'},
  CUBE :{geo:new THREE.BoxGeometry(1.5,1.5,1.5),  hp:140,speed:1.5,fireInt:3.4,charge:1.0, dmg:18,range:8, score:25,r:1.15,name:'куб'},
  ICO  :{geo:new THREE.IcosahedronGeometry(1.1),  hp:100,speed:2.1,fireInt:1.7,charge:0.75,dmg:15,range:13,score:30,r:1.1, name:'икоса'},
};
function pickType(d){
  const r=Math.random();
  const cube=Math.min(0.08+d*0.04,0.30);
  const ico =d>=2?Math.min(0.05+d*0.03,0.22):0;
  const octa=Math.min(0.24+d*0.02,0.34);
  if(r<cube) return 'CUBE';
  if(r<cube+ico) return 'ICO';
  if(r<cube+ico+octa) return 'OCTA';
  return 'TETRA';
}
function spawnEnemy(x,z,d){
  const t=ETYPES[pickType(d)];
  const mat=new THREE.MeshLambertMaterial({color:0x1c0503,emissive:RED,emissiveIntensity:0.5});
  const mesh=new THREE.Mesh(t.geo,mat);
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(t.geo),
    new THREE.LineBasicMaterial({color:0x0d0b09})));
  // прицельная линия и луч
  const aim=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,1,5),
    new THREE.MeshBasicMaterial({color:RED,transparent:true,opacity:0.55}));
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1,6),
    new THREE.MeshBasicMaterial({color:0xff2b17}));
  aim.visible=false; beam.visible=false;
  scene.add(aim); scene.add(beam);
  eGroup.add(mesh);
  const e={type:t,mesh,aim,beam,center:new THREE.Vector3(x,1.6,z),
    hp:t.hp*(1+(d-1)*0.06), r:t.r, maxHp:t.hp*(1+(d-1)*0.06),
    state:'hunt', atkT:rnd(1.2,3.5), chargeT:0, beamT:0, loseT:0,
    aimP:new THREE.Vector3(x,1.2,z), phase:rnd(0,9), spin:rnd(0.6,1.6),
    strafe:Math.random()<0.5?1:-1, strafeT:rnd(1,3), flash:0, spawnT:0.5, osc:null};
  mesh.position.copy(e.center);
  mesh.scale.setScalar(0.01);
  enemies.push(e);
}
function orientCyl(mesh,a,b){
  const dir=new THREE.Vector3().subVectors(b,a);
  const len=dir.length(); if(len<0.01){mesh.visible=false;return;}
  mesh.scale.set(1,len,1);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
}
function damageEnemy(e,dmg,hitPos){
  e.hp-=dmg; e.flash=1;
  hitmark();
  SFX.hit();
  if(e.hp<=0) killEnemy(e);
  else if(hitPos) sparks(hitPos,6,0xff2b17);
}
function killEnemy(e){
  chargeSound(false,e);
  scene.remove(e.aim); scene.remove(e.beam);
  eGroup.remove(e.mesh);
  enemies.splice(enemies.indexOf(e),1);
  kills++; score+=e.type.score;
  SFX.kill();
  // разлёт красных осколков
  for(let i=0;i<14;i++){
    const v=new THREE.Vector3(rnd(-4,4),rnd(1,6),rnd(-4,4));
    spawnParticle(e.center,v,rnd(0.5,1.1),0.15,RED,true,1);
  }
  if(Math.random()<0.16) spawnPickup(e.center.x,e.center.z);
  updateHUD();
}
function updateEnemies(dt){
  const pChest=new THREE.Vector3(player.pos.x,player.pos.y+1.1,player.pos.z);
  for(const e of enemies){
    e.phase+=dt;
    if(e.spawnT>0){ e.spawnT-=dt; e.mesh.scale.setScalar(clamp(1-e.spawnT/0.5,0.01,1)); }
    e.flash=Math.max(0,e.flash-dt*5);
    e.mesh.material.emissiveIntensity=0.5+e.flash*1.2;
    const dx=player.pos.x-e.center.x, dz=player.pos.z-e.center.z;
    const dist=Math.hypot(dx,dz);
    const los=dist<40?LOS(e.center.x,e.center.z,player.pos.x,player.pos.z):false;

    let mvx=0,mvz=0;
    if(e.state==='hunt'){
      e.atkT-=dt;
      e.strafeT-=dt; if(e.strafeT<=0){ e.strafe*=-1; e.strafeT=rnd(1.5,3.5); }
      const nx=dx/dist, nz=dz/dist;
      if(dist>e.type.range){ mvx=nx; mvz=nz; }
      else if(dist<e.type.range*0.5){ mvx=-nx; mvz=-nz; }
      else { mvx=-nz*e.strafe; mvz=nx*e.strafe; }
      if(e.atkT<=0&&los&&dist<27&&e.spawnT<=0){
        e.state='charge'; e.chargeT=e.type.charge; e.loseT=0;
        e.aimP.copy(pChest); chargeSound(true,e);
      }
    } else if(e.state==='charge'){
      // прицел ведёт игрока с запаздыванием — на бегу можно уклониться
      e.aimP.lerp(pChest,1-Math.exp(-4.5*dt));
      e.chargeT-=dt;
      if(!los){ e.loseT+=dt; if(e.loseT>0.25){ e.state='hunt'; e.atkT=0.7; chargeSound(false,e); e.aim.visible=false; } }
      else e.loseT=0;
      e.aim.visible=los;
      if(los) orientCyl(e.aim,e.center,e.aimP);
      if(e.chargeT<=0){
        e.state='hunt'; e.atkT=e.type.fireInt*rnd(0.85,1.3);
        chargeSound(false,e); e.aim.visible=false;
        enemyFire(e);
      }
      mvx=dx/dist*0.15; mvz=dz/dist*0.15;
    }
    if(e.beamT>0){ e.beamT-=dt; if(e.beamT<=0) e.beam.visible=false; }

    // движение со скольжением по стенам
    const sp=e.type.speed*(e.state==='charge'?0.3:1);
    moveMC(e.center,mvx*sp*dt,mvz*sp*dt,e.r*0.8);
    // отталкивание от других фигур
    for(const o of enemies){ if(o===e) continue;
      const ox=e.center.x-o.center.x, oz=e.center.z-o.center.z;
      const d2=ox*ox+oz*oz, rr=(e.r+o.r)*0.9;
      if(d2>0.001&&d2<rr*rr){ const d=Math.sqrt(d2),push=(rr-d)*0.5;
        e.center.x+=ox/d*push*dt*8; e.center.z+=oz/d*push*dt*8; }
    }
    // парение и вращение
    e.center.y=1.6+Math.sin(e.phase*1.4)*0.25;
    e.mesh.position.copy(e.center);
    e.mesh.rotation.y+=e.spin*dt;
    e.mesh.rotation.x=Math.sin(e.phase*0.7)*0.15;
  }
}
function enemyFire(e){
  const dir=new THREE.Vector3().subVectors(e.aimP,e.center).normalize();
  const wallD=castWall3D(e.center,dir,60);
  const end=e.center.clone().addScaledVector(dir,wallD);
  orientCyl(e.beam,e.center,end);
  e.beam.visible=true; e.beamT=0.12;
  SFX.zap(clamp(1-e.center.distanceTo(player.pos)/45,0.1,0.35));
  sparks(end,5,0xff2b17);
  // попадание: игрок в цилиндре луча + чистая видимость
  const rel=new THREE.Vector3().subVectors(player.pos.clone().add(new THREE.Vector3(0,1.1,0)),e.center);
  const proj=rel.dot(dir);
  if(proj>0){
    const perp=rel.sub(dir.clone().multiplyScalar(proj)).length();
    if(perp<0.62&&LOS(e.center.x,e.center.z,player.pos.x,player.pos.z)){
      damagePlayer(e.type.dmg*(1+(depth-1)*0.04));
    }
  }
}

function tryFire(){
  if(cooldown>0||switchT>0.15) return;
  const w=WEAPONS[curW], st=gunState[curW];
  if(st.reloading>0) return;
  if(st.ammo<=0){ SFX.dry(); startReload(); return; }
  st.ammo--; cooldown=w.rate; recoil=1;

  flashMesh.rotation.z=Math.random()*3;
  flashMesh.scale.setScalar(rnd(0.8,1.5));
  flashLight.intensity=curW===1?3.6:2.6;
  setTimeout(()=>flashMesh.visible=false,55);
  if(w.rocket){
    SFX.rocket(); spawnRocket();
  } else {
    if(curW===0) SFX.rev(); else SFX.shotgun();
    const o=camera.position.clone();
    for(let i=0;i<w.pellets;i++){
      const d=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
      d.x+=rnd(-w.spread,w.spread); d.y+=rnd(-w.spread,w.spread); d.z+=rnd(-w.spread,w.spread);
      d.normalize();
      hitscan(o,d,w.dmg);
    }
    // гильза
    const gv=new THREE.Vector3(rnd(1,2.4),rnd(1.5,2.6),rnd(-0.4,0.4)).applyQuaternion(camera.quaternion);
    spawnParticle(camera.position.clone().add(new THREE.Vector3(0.3,-0.2,0)),gv,
      1.2,0.05,0xb98a2e,true,1);
    if(gunModels[curW].userData.drum) gunModels[curW].userData.drum.rotation.z+=Math.PI/3;
  }
  if(st.ammo<=0) setTimeout(startReload,300);
  updateHUD();
}
function hitscan(o,d,dmg){
  const maxD=200;
  const wallD=castWall3D(o,d,maxD);
  let best=null,bt=wallD;
  for(const e of enemies){
    const t=raySphere(o,d,e.center,e.r*1.05);
    if(t>0&&t<bt){ bt=t; best=e; }
  }
  const hitP=o.clone().addScaledVector(d,bt);
  if(best) damageEnemy(best,dmg,hitP);
  else if(bt<maxD) sparks(hitP,3,0x2a241c);
}
// точный выстрел — мгновенный hitscan

// ---------- ракеты ----------
function spawnRocket(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.44,10),
    new THREE.MeshLambertMaterial({color:0x1a1712}));
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.075,0.2,10),
    new THREE.MeshLambertMaterial({color:0xe02414,emissive:0xe02414,emissiveIntensity:0.4}));
  nose.position.y=0.32;
  g.add(body,nose);
  const o=camera.position.clone().add(new THREE.Vector3(0.35,-0.3,0).applyQuaternion(camera.quaternion));
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  g.position.copy(o);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  scene.add(g);
  rockets.push({mesh:g,pos:o.clone(),vel:dir.multiplyScalar(30),dist:0});
}
function explode(pos){
  SFX.boom();
  boomLight.position.copy(pos); boomLight.intensity=7;
  shake=Math.min(shake+0.6,1.2);
  for(let i=0;i<26;i++){
    const v=new THREE.Vector3(rnd(-8,8),rnd(-2,10),rnd(-8,8));
    const c=[0xe02414,0x2a241c,0xe8e2d4][rndi(0,2)];
    spawnParticle(pos,v,rnd(0.4,0.9),rnd(0.08,0.2),c,true,0.96);
  }
  for(let i=0;i<10;i++)
    spawnParticle(pos.clone().add(new THREE.Vector3(rnd(-1,1),rnd(0,1.5),rnd(-1,1))),
      new THREE.Vector3(rnd(-0.5,0.5),rnd(0.5,1.5),rnd(-0.5,0.5)),
      rnd(0.8,1.4),0.5,0x6b6355,false,2.4);
  // сплэш по врагам
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i], d=e.center.distanceTo(pos);
    if(d<4.6) damageEnemy(e,130*(1-d/4.6));
  }
  // сплэш по игроку — ракетный прыжок в придачу
  const pd=camera.position.distanceTo(pos);
  if(pd<4.6){
    damagePlayer(55*(1-pd/4.6));
    const push=new THREE.Vector3().subVectors(camera.position,pos).normalize().multiplyScalar(9);
    player.vel.add(push);
    player.vel.y=Math.max(player.vel.y,4);
  }
}
function updateRockets(dt){
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.pos.addScaledVector(r.vel,dt); r.dist+=r.vel.length()*dt;
    r.mesh.position.copy(r.pos);
    spawnParticle(r.pos.clone(),new THREE.Vector3(rnd(-0.3,0.3),rnd(0.3,0.8),rnd(-0.3,0.3)),
      rnd(0.4,0.7),0.14,0x8d8574,false,1.8);
    let hit=r.dist>130||r.pos.y<0.15||collide(r.pos.x,r.pos.z,0.1);
    if(!hit) for(const e of enemies)
      if(e.center.distanceTo(r.pos)<e.r+0.35){hit=true;break;}
    if(hit){ scene.remove(r.mesh); rockets.splice(i,1); explode(r.pos.clone()); }
  }
}

// ---------- частицы ----------
const partGeo=new THREE.TetrahedronGeometry(1);
function spawnParticle(pos,vel,life,size,color,grav,gravMul){
  if(particles.length>340) return;
  const mat=new THREE.MeshBasicMaterial({color,transparent:true});
  const m=new THREE.Mesh(partGeo,mat);
  m.position.copy(pos); m.scale.setScalar(size);
  particleGroup.add(m);
  particles.push({m,vel,life,max:life,grav:grav?GRAV*(gravMul||1):0,
    spin:new THREE.Vector3(rnd(-5,5),rnd(-5,5),rnd(-5,5)),grow:grav?0:1});
}
function killParticle(i){
  particleGroup.remove(particles[i].m);
  particles[i].m.material.dispose();
  particles.splice(i,1);
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){ killParticle(i); continue; }
    p.vel.y-=p.grav*dt;
    p.m.position.addScaledVector(p.vel,dt);
    if(p.m.position.y<0.03&&p.grav){ p.m.position.y=0.03; p.vel.y*=-0.35; p.vel.x*=0.6; p.vel.z*=0.6; }
    p.m.rotation.x+=p.spin.x*dt; p.m.rotation.y+=p.spin.y*dt;
    const k=p.life/p.max;
    p.m.material.opacity=p.grow?k:Math.min(1,k*2);
    if(p.grow>1) p.m.scale.multiplyScalar(1+p.grow*dt*0.6);
  }
}
function sparks(pos,n,color){
  for(let i=0;i<n;i++){
    const v=new THREE.Vector3(rnd(-3,3),rnd(0,4),rnd(-3,3));
    spawnParticle(pos,v,rnd(0.25,0.5),rnd(0.03,0.06),color,true,1);
  }
}

// ---------- подборы (осколки сна = +hp) ----------
function spawnPickup(x,z){
  const m=new THREE.Mesh(new THREE.OctahedronGeometry(0.28),
    new THREE.MeshLambertMaterial({color:0xf5efe2,emissive:0xffffff,emissiveIntensity:0.35}));
  m.position.set(x,0.8,z);
  levelGroup.add(m);
  pickups.push({m,x,z,t:25});
}
function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    p.t-=dt;
    p.m.rotation.y+=2*dt;
    p.m.position.y=0.8+Math.sin(gameT*2.5)*0.12;
    p.m.visible=p.t>5||Math.sin(gameT*12)>0;
    const d=Math.hypot(player.pos.x-p.x,player.pos.z-p.z);
    if(d<1.4&&player.hp<100){
      player.hp=Math.min(100,player.hp+22); score+=5;
      SFX.pickup(); updateHUD();
      levelGroup.remove(p.m); pickups.splice(i,1);
    } else if(p.t<=0){ levelGroup.remove(p.m); pickups.splice(i,1); }
  }
}

// ---------- HUD ----------
const $=id=>document.getElementById(id);
function hitmark(){
  const c=$('crosshair');
  c.classList.remove('hit'); void c.offsetWidth; c.classList.add('hit');
}
function updateHUD(){
  $('ui-depth').textContent=String(depth).padStart(2,'0');
  $('ui-score').textContent=score;
  $('ui-kills').textContent=kills;
  $('hp-num').textContent=Math.ceil(player.hp);
  $('hp-fill').style.width=player.hp+'%';
  const low=player.hp<=30;
  $('hp-num').classList.toggle('low',low);
  $('hp-fill').classList.toggle('low',low);
  $('wpn-name').textContent=WEAPONS[curW].name;
  $('ammo-cur').textContent=gunState[curW].ammo;
  $('ammo-mag').textContent=WEAPONS[curW].mag;
  $('reload-tag').textContent=gunState[curW].reloading>0?'перезарядка':'';
}

// ---------- главный цикл ----------
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);

  // чёрное солнце — всегда на одном направлении
  blackSun.position.copy(camera.position).addScaledVector(SUNDIR,340);
  blackSun.quaternion.copy(camera.quaternion);

  if(state==='playing'){
    gameT+=dt;

    // --- движение игрока ---
    let f=0,s=0;
    if(keys['KeyW']||keys['ArrowUp'])f++;
    if(keys['KeyS']||keys['ArrowDown'])f--;
    if(keys['KeyD']||keys['ArrowRight'])s++;
    if(keys['KeyA']||keys['ArrowLeft'])s--;
    const running=(keys['ShiftLeft']||keys['ShiftRight'])&&f>0;
    const speed=running?RUN:WALK;
    const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
    let wx=(-sy*f+cy*s), wz=(-cy*f-sy*s);
    const wl=Math.hypot(wx,wz); if(wl>0){wx/=wl;wz/=wl;}
    const k=1-Math.exp(-11*dt);
    player.vel.x+=(wx*speed-player.vel.x)*k;
    player.vel.z+=(wz*speed-player.vel.z)*k;
    if(keys['Space']&&player.onGround){ player.vel.y=JUMP; player.onGround=false; }
    player.vel.y-=GRAV*dt;
    moveMC(player.pos,player.vel.x*dt,player.vel.z*dt,PLAYER_R);
    player.pos.y+=player.vel.y*dt;
    if(player.pos.y<=0){ player.pos.y=0; player.vel.y=0; player.onGround=true; }

    // шаги + бобинг
    const spxz=Math.hypot(player.vel.x,player.vel.z);
    if(player.onGround&&spxz>1){
      player.bob+=spxz*dt*1.7;
      player.stepAcc+=spxz*dt;
      if(player.stepAcc>2.6){ player.stepAcc=0; SFX.step(); }
    }
    // регенерация в тишине
    if(gameT-player.lastHurt>5&&player.hp<100){
      player.hp=Math.min(100,player.hp+4.5*dt); updateHUD();
    }

    // --- камера ---
    camera.position.set(player.pos.x,player.pos.y+EYE,player.pos.z);
    camera.rotation.set(player.pitch,player.yaw,0);
    if(shake>0.002){
      camera.rotation.x+=rnd(-1,1)*shake*0.035;
      camera.rotation.y+=rnd(-1,1)*shake*0.035;
      camera.rotation.z+=rnd(-1,1)*shake*0.02;
      shake*=Math.exp(-6*dt);
    }
    const targetFov=75+(running?5:0);
    if(Math.abs(camera.fov-targetFov)>0.1){
      camera.fov+=(targetFov-camera.fov)*Math.min(1,10*dt);
      camera.updateProjectionMatrix();
    }

    // --- view-model ---
    recoil*=Math.exp(-9*dt);
    if(switchT>0) switchT-=dt;
    const gm=gunModels[curW], st=gunState[curW];
    let ry=0,rp=0;
    if(st.reloading>0){
      st.reloading-=dt;
      const pr=1-st.reloading/WEAPONS[curW].reload;
      rp=-Math.sin(pr*Math.PI)*0.9;
      if(st.reloading<=0){ st.ammo=WEAPONS[curW].mag; SFX.click(); updateHUD(); }
    }
    const sw=switchT>0?switchT/0.4:0;
    const amp=gm.userData.bobAmp*Math.min(1,spxz/WALK);
    gunRig.position.set(
      GUN_BASE.x+Math.sin(player.bob)*amp,
      GUN_BASE.y-Math.abs(Math.cos(player.bob))*amp*1.4-sw*0.55+rp*0.18,
      GUN_BASE.z+recoil*0.24
    );
    gunRig.rotation.set(rp+recoil*0.35,0,recoil*0.06);
    flashLight.intensity*=Math.exp(-26*dt);
    if(flashLight.intensity<0.02)flashLight.intensity=0;
    boomLight.intensity*=Math.exp(-8*dt);

    updateEnemies(dt);
    updateRockets(dt);
    updateParticles(dt);
    updatePickups(dt);

    // маяк пульсирует
    if(levelGroup){
      const b=levelGroup.userData.beacon;
      b.material.opacity=0.18+Math.sin(gameT*2.2)*0.07;
      const r=levelGroup.userData.ring;
      r.scale.setScalar(1+Math.sin(gameT*2.2)*0.12);
      r.rotation.z+=dt*0.8;
    }
    // гиганты неба вращаются
    if(levelGroup) for(const o of levelGroup.children)
      if(o.userData.sky){ o.rotation.y+=o.userData.spin*dt; o.rotation.x+=o.userData.spin*0.4*dt; }

    // выход: дойти до света
    if(Math.hypot(player.pos.x-exitPos.x,player.pos.z-exitPos.z)<1.5){
      state='transition';
      SFX.portal();
      score+=100*depth;
      depth++; bestDepth=Math.max(bestDepth,depth);
      player.hp=Math.min(100,player.hp+35);
      showTransition();
      setTimeout(()=>{
        if(state!=='transition') return;
        buildLevel(depth); resetPlayer();
        if(locked){ state='playing'; }
        else { state='paused'; showPause(); }
        document.getElementById('overlay').classList.add('hidden');
      },1500);
    }

    // вспышка урона
    if(dmgFlash>0){ dmgFlash-=dt*2.2; $('damage').style.opacity=Math.max(0,dmgFlash); }
    else $('damage').style.opacity=0;

    // таймер выстрела
    if(cooldown>0) cooldown-=dt;
    updateHUD();
  }
  else if(state==='transition'||state==='dead'){
    updateParticles(dt);
  }

  renderer.render(scene,camera);
}
loop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
