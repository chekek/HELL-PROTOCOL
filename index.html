<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>БЕССОННИЦА — лабиринт, из которого не выходят</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e02414; --ink:#14120f; --paper:#e8e2d4;
    --blue:#2f7cff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#d8d2c2;
    font-family:'IBM Plex Mono',monospace;cursor:crosshair;user-select:none;
    -webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}

  #frame{position:fixed;inset:14px;border:1px solid rgba(20,18,15,.28);pointer-events:none;z-index:5;
    transition:border-color 1.2s}
  #frame::before,#frame::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--ink);
    transition:border-color 1.2s}
  #frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
  #frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none}

  #crosshair{position:fixed;left:50%;top:50%;width:0;height:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
  body.playing #crosshair{opacity:1}
  #crosshair span{position:absolute;background:var(--ink);transition:background 1.2s}
  #crosshair .c1{width:2px;height:7px;left:-1px;top:-13px}
  #crosshair .c2{width:2px;height:7px;left:-1px;top:6px}
  #crosshair .c3{width:7px;height:2px;left:-13px;top:-1px}
  #crosshair .c4{width:7px;height:2px;left:6px;top:-1px}
  #crosshair.hit span{background:var(--red)}
  #crosshair.hit{animation:hitmk .14s ease-out}
  @keyframes hitmk{0%{transform:scale(1.6)}100%{transform:scale(1)}}

  #vignette{position:fixed;inset:0;pointer-events:none;z-index:4}
  #damage{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;
    background:radial-gradient(ellipse at center,transparent 42%,rgba(224,36,20,.55) 100%)}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:6;color:var(--ink);
    text-transform:uppercase;letter-spacing:.14em;font-size:13px;opacity:0;transition:opacity .3s,color 1.2s}
  body.playing #hud{opacity:1}
  #hud-tl{position:absolute;top:34px;left:38px;line-height:1.9}
  #hud-tl b{font-weight:700}
  .dim{opacity:.55}
  #ui-instab{display:none;color:var(--red)}
  #ui-echo{display:none;color:var(--blue)}
  body.night #ui-echo{color:#7fb0ff}
  #ui-mod{display:none}
  #hud-bl{position:absolute;bottom:34px;left:38px}
  #hp-num{font-family:'Unbounded';font-weight:900;font-size:44px;line-height:1;letter-spacing:.02em}
  #hp-num.low{color:var(--red)}
  #hp-bar{width:180px;height:4px;background:rgba(20,18,15,.18);margin-top:8px;transition:background 1.2s}
  #hp-fill{height:100%;background:var(--ink);width:100%;transition:background 1.2s}
  #hp-fill.low{background:var(--red)}
  #armor-bar{width:180px;height:4px;background:rgba(47,124,255,.18);margin-top:5px;display:none}
  #armor-fill{height:100%;background:var(--blue);width:100%;box-shadow:0 0 6px rgba(47,124,255,.6)}
  #hud-br{position:absolute;bottom:34px;right:38px;text-align:right}
  #wpn-name{font-size:12px;letter-spacing:.28em;margin-bottom:4px}
  #ammo{font-family:'Unbounded';font-weight:700;font-size:38px;line-height:1}
  #ammo .sep{opacity:.35;font-weight:400;margin:0 4px}
  #ammo .mag{font-size:18px;opacity:.5}
  #reload-tag{font-size:11px;color:var(--red);letter-spacing:.3em;height:14px;margin-top:4px;
    animation:blink .5s steps(2) infinite}
  @keyframes blink{to{opacity:.15}}
  #hint{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:.3em;opacity:.6;transition:opacity 1.2s;text-align:center;width:90%}

  body.night #hud{color:#e8e2d4}
  body.night #hp-fill{background:#e8e2d4}
  body.night #hp-bar{background:rgba(232,226,212,.16)}
  body.night #frame{border-color:rgba(232,226,212,.22)}
  body.night #frame::before,body.night #frame::after{border-color:#e8e2d4}
  body.night #crosshair span{background:#e8e2d4}
  body.night #ui-instab{color:#ff4a38}

  /* ---------- мобильный HUD ---------- */
  body.touch #hud-tl{font-size:11px;line-height:1.7;top:22px;left:20px}
  body.touch #hud-bl{top:20px;bottom:auto;right:76px;left:auto;text-align:right}
  body.touch #hp-num{font-size:25px}
  body.touch #hp-bar,body.touch #armor-bar{width:108px;margin-top:5px}
  body.touch #hud-br{top:20px;bottom:auto;right:auto;left:50%;transform:translateX(-50%);text-align:center}
  body.touch #ammo{font-size:21px}
  body.touch #wpn-name{font-size:10px}
  body.touch #hint{bottom:41%;font-size:10.5px}

  /* ---------- сенсорное управление ---------- */
  #touch-ui{position:fixed;inset:0;z-index:8;display:none;pointer-events:none;
    -webkit-touch-callout:none}
  body.touch.playing #touch-ui{display:block}
  .tbtn,.tpad{position:fixed;display:flex;align-items:center;justify-content:center;
    border:1.5px solid rgba(20,18,15,.55);background:rgba(232,226,212,.3);color:var(--ink);
    touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  body.night .tbtn,body.night .tpad{border-color:rgba(232,226,212,.5);color:#e8e2d4;
    background:rgba(15,18,28,.25)}
  .tpad{border-radius:50%}
  .tknob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;background:rgba(20,18,15,.28);border:1.5px solid rgba(20,18,15,.5);
    pointer-events:none}
  body.night .tknob{background:rgba(232,226,212,.22);border-color:rgba(232,226,212,.55)}
  .t-chev{position:absolute;left:50%;transform:translateX(-50%);width:20px;height:20px;opacity:.4;pointer-events:none}
  .t-chev.up{top:11px}
  .t-chev.dn{bottom:11px}
  #t-look{right:22px;bottom:64px;width:148px;height:148px}
  #t-move{left:22px;bottom:64px;width:126px;height:126px}
  #t-knob-m{width:50px;height:50px;margin:-25px 0 0 -25px}
  #t-fire{left:164px;bottom:80px;width:94px;height:94px;border-radius:50%;
    border-color:rgba(224,36,20,.8);color:var(--red)}
  #t-fire svg{width:42%;height:42%}
  #t-fire.on{background:rgba(224,36,20,.32)}
  #t-jump{left:272px;bottom:158px;width:58px;height:58px;border-radius:50%}
  #t-jump svg,#t-pause svg,#t-reload svg{width:46%;height:46%}
  #t-pause{top:14px;right:14px;width:44px;height:44px;border-radius:10px}
  #t-wcol{position:fixed;right:22px;top:92px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}
  #t-wcol .tbtn{position:relative}
  .wbtn{width:46px;height:46px;border-radius:10px;
    font-family:'Unbounded';font-weight:700;font-size:15px}
  .wbtn.sel{background:var(--red);border-color:var(--red);color:#fff}
  #t-reload{width:46px;height:46px;border-radius:10px}
  #rotate-hint{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:30;
    display:none;background:rgba(20,18,15,.85);color:#e8e2d4;padding:14px 22px;
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;pointer-events:none;
    border:1px solid rgba(232,226,212,.35);text-align:center}
  @media (orientation:portrait){ body.touch #rotate-hint{display:block} }
  @media (max-height:430px){
    .wbtn,#t-reload{width:40px;height:40px;font-size:13px}
    #t-wcol{top:64px;gap:5px}
    #t-look{width:128px;height:128px;bottom:40px}
    #t-move{width:112px;height:112px;bottom:46px}
    .tknob{width:46px;height:46px;margin:-23px 0 0 -23px}
    #t-knob-m{width:42px;height:42px;margin:-21px 0 0 -21px}
    #t-fire{width:82px;height:82px;left:148px;bottom:56px}
    #t-jump{left:244px;bottom:132px;width:52px;height:52px}
  }

  #overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(232,226,212,.9);backdrop-filter:blur(6px);color:var(--ink);text-align:center;
    transition:opacity .5s;cursor:pointer}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay .box{max-width:640px;padding:40px}
  #overlay h1{font-family:'Unbounded';font-weight:900;font-size:58px;letter-spacing:.04em;line-height:1}
  #overlay h1 em{font-style:normal;color:var(--red)}
  #overlay .sub{margin-top:14px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
  #overlay .ctrl{margin-top:34px;font-size:12.5px;line-height:2.1;letter-spacing:.1em;text-transform:uppercase;
    border-top:1px solid rgba(20,18,15,.25);border-bottom:1px solid rgba(20,18,15,.25);padding:16px 0}
  #overlay .ctrl b{display:inline-block;min-width:170px;font-weight:700}
  #overlay .go{margin-top:36px;font-family:'Unbounded';font-weight:700;font-size:15px;
    letter-spacing:.24em;color:var(--red);animation:blink 1.1s steps(2) infinite}
  #overlay .quote{margin-top:26px;font-size:12px;letter-spacing:.18em;opacity:.55;text-transform:lowercase}
  #overlay .stat{margin-top:22px;font-size:14px;letter-spacing:.2em;line-height:2}
  #overlay .stat b{color:var(--red)}
  #overlay .lvl-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:34px auto 0;max-width:460px}
  #overlay .lvl-btn{font-family:'Unbounded';font-weight:700;font-size:15px;padding:13px 0;
    background:none;border:1px solid rgba(20,18,15,.45);color:var(--ink);cursor:pointer;
    transition:all .13s;letter-spacing:.04em}
  #overlay .lvl-btn:hover{background:var(--red);border-color:var(--red);color:#fff;transform:translateY(-2px)}
  #overlay .lvl-btn.cur{border-color:var(--red);color:var(--red)}
  #overlay .lvl-btn.cur:hover{color:#fff}
  #overlay .lvl-btn.inf{border-color:var(--blue);color:var(--blue)}
  #overlay .lvl-btn.inf:hover{background:var(--blue);border-color:var(--blue);color:#fff;transform:translateY(-2px)}
  /* платформа / продолжение / модификаторы */
  #overlay .plat-row{display:flex;gap:14px;justify-content:center;margin-top:36px;flex-wrap:wrap}
  #overlay .plat-btn{font-family:'IBM Plex Mono',monospace;padding:16px 22px;background:none;
    border:1px solid rgba(20,18,15,.45);color:var(--ink);cursor:pointer;
    display:flex;flex-direction:column;gap:7px;align-items:center;
    text-transform:uppercase;letter-spacing:.14em;transition:all .13s}
  #overlay .plat-btn b{font-family:'Unbounded';font-weight:700;font-size:15px;letter-spacing:.06em}
  #overlay .plat-btn span{font-size:10.5px;opacity:.6}
  #overlay .plat-btn:hover{background:var(--ink);color:var(--paper);transform:translateY(-2px)}
  #overlay .plat-btn.sel{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  #overlay .plat-btn.sel b{color:var(--red)}
  #overlay .menu-link{margin-top:18px;font-size:11px;letter-spacing:.22em;opacity:.5;text-transform:uppercase}
  @media (max-width:760px){
    #overlay h1{font-size:34px}
    #overlay .box{padding:22px;max-width:94vw}
    #overlay .sub{font-size:10.5px;margin-top:10px}
    #overlay .quote{font-size:10px;margin-top:16px}
    #overlay .ctrl{font-size:10.5px;padding:10px 0;margin-top:22px}
    #overlay .ctrl b{min-width:130px}
    #overlay .stat{font-size:11px}
    #overlay .plat-btn{padding:12px 14px}
    #overlay .plat-btn b{font-size:12px}
    #overlay .plat-btn span{font-size:9px}
    #overlay .go{font-size:12px;margin-top:24px}
    #overlay .lvl-grid{grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px}
    #overlay .lvl-btn{font-size:13px;padding:10px 0}
  }
</style>
</head>
<body>
<div id="frame"></div>
<div id="crosshair"><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span></div>
<div id="vignette"></div>
<div id="damage"></div>

<div id="hud">
  <div id="hud-tl">
    <div>глубина <b id="ui-depth">01</b></div>
    <div>счёт <b id="ui-score">0</b></div>
    <div class="dim">уничтожено <b id="ui-kills">0</b> · пробуждений <b id="ui-deaths">0</b></div>
    <div id="ui-instab"></div>
    <div id="ui-echo"></div>
    <div id="ui-mod" class="dim"></div>
  </div>
  <div id="hud-bl">
    <div id="hp-num">100</div>
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="armor-bar"><div id="armor-fill"></div></div>
  </div>
  <div id="hud-br">
    <div id="wpn-name">Револьвер</div>
    <div id="ammo"><span id="ammo-cur">6</span><span class="sep">/</span><span class="mag" id="ammo-mag">6</span></div>
    <div id="reload-tag"></div>
  </div>
  <div id="hint">найди белый столб света — он ведёт глубже</div>
</div>

<!-- сенсорное управление -->
<div id="touch-ui">
  <div id="t-pause" class="tbtn">
    <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
  </div>
  <div id="t-move" class="tpad">
    <svg class="t-chev up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="t-chev dn" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div id="t-knob-m" class="tknob"></div>
  </div>
  <div id="t-fire" class="tbtn">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
  </div>
  <div id="t-jump" class="tbtn">
    <svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div id="t-look" class="tpad">
    <div id="t-knob-l" class="tknob"></div>
  </div>
  <div id="t-wcol">
    <div id="t-w1" class="tbtn wbtn">1</div>
    <div id="t-w2" class="tbtn wbtn">2</div>
    <div id="t-w3" class="tbtn wbtn">3</div>
    <div id="t-w4" class="tbtn wbtn">4</div>
    <div id="t-w5" class="tbtn wbtn">5</div>
    <div id="t-reload" class="tbtn">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>
<div id="rotate-hint">поверни телефон горизонтально</div>

<div id="overlay"><div class="box" id="overlay-box"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   БЕССОННИЦА — сюрреалистичный FPS в одном файле
   титул: выбор платформы — ПК или МОБИЛЬНОЕ
   сохранение: localStorage — сон помнит глубину и счёт
   награда за рассвет: модификатор на следующий сон —
     лунная гравитация / бесконечный луч / АК-47
   оружие: отдельный проход рендера, АК-47 — автоогонь
   1–7:   небо темнеет до ночи; с 7-й — шёпот
   3+:    пулемётчики — очереди коротких лучей
   10:    стены дышат
   11–16: лабиринт перестраивает сам себя
   15:    лазер (оружие за здоровье)
   16:    броня — сфера Дайсона
   17+:   красная луна; эхо сна → 2300 = рассвет
   24+:   петля — меньше 50 очков за проход = та же глубина
   РАССВЕТ: бессмертие, лунная гравитация, фигуры-платформы
   секрет: ПК — Shift×5 · тач — 5 тапов по заголовку
   ============================================================ */

// ---------- константы ----------
const CS = 4;
const WALL_H = 5;
const EYE = 1.7, PLAYER_R = 0.55;
const WALK = 8.2, RUN = 12.4, JUMP = 7, GRAV = 22;
const RED = 0xe02414, BLUE = 0x2f7cff;
const SINK_DEPTH = WALL_H + 0.6;
const SOLID_Y = -(WALL_H - 0.45);
const DIRS4 = [[1,0],[-1,0],[0,1],[0,-1]];
const LASER_TICK = 0.16, LASER_COST = 6, LASER_MIN_HP = 12;
const MOON_TELE = 1.15, MOON_RADIUS = 2.6, MOON_DMG = 34;
const ARMOR_REGEN = 7, ARMOR_DELAY = 4;
const ECHO_GOAL = 2300;
const LOOP_DEPTH = 24;
const LOOP_MIN = 50;
const INF_GRAV = 5, INF_JUMP = 9.5, INF_WALK = 9.5, INF_RUN = 14;
const INF_ENEMIES = 24;
const TOUCH_SENS = 0.0062;
// модификатор «лунная гравитация»
const MOONG_GRAV = 7, MOONG_JUMP = 9.5;
const SAVE_KEY = 'insomnia_save_v1';

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const easeInOut = t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

// ---------- сохранение ----------
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      d:depth, s:score, k:kills, de:deaths, e:echo, b:bestDepth,
      m:mod, inf:infinityMode
    }));
  }catch(err){}
}
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o||typeof o.d!=='number'||o.d<1) return null;
    return o;
  }catch(err){ return null; }
}
function modName(m){
  return m==='moon'?'лунная гравитация':m==='beam'?'бесконечный луч':m==='ak'?'ак-47':'';
}

// ---------- звук ----------
let AC=null, master=null, noiseBuf=null;
let humG=null, laserOsc=null, moonOsc=null;
function initAudio(){
  if(AC){ AC.resume(); return; }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.42; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const g=AC.createGain(); g.gain.value=0.05; g.connect(master);
  Whisper.droneG=g;
  [55,55.7,110.4].forEach((f,i)=>{
    const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f;
    const og=AC.createGain(); og.gain.value=i===2?0.25:1;
    o.connect(og); og.connect(g); o.start();
  });
  const lfo=AC.createOscillator(); lfo.frequency.value=0.09;
  const lg=AC.createGain(); lg.gain.value=0.022;
  lfo.connect(lg); lg.connect(g.gain); lfo.start();
  humG=AC.createGain(); humG.gain.value=0; humG.connect(master);
  const h1=AC.createOscillator(); h1.type='sine'; h1.frequency.value=52;
  const h2=AC.createOscillator(); h2.type='sine'; h2.frequency.value=104.7;
  const h2g=AC.createGain(); h2g.gain.value=0.4;
  const h3=AC.createOscillator(); h3.type='sine'; h3.frequency.value=156.8;
  const h3g=AC.createGain(); h3g.gain.value=0.18;
  h1.connect(humG); h2.connect(h2g); h2g.connect(humG); h3.connect(h3g); h3g.connect(humG);
  h1.start(); h2.start(); h3.start();
  const dp=AC.createGain(); dp.gain.value=0.0001; dp.connect(master);
  [[110,0.3],[164.81,0.22],[220,0.18],[277.18,0.12]].forEach(([f,v])=>{
    const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f;
    const og=AC.createGain(); og.gain.value=v;
    o.connect(og); og.connect(dp); o.start();
  });
  Whisper.dawnG=dp;
  initWhisperPool();
}
function sNoise(dur,vol,freq,type,q,delay){
  if(!AC) return;
  const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;

  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

  s.start(t); s.stop(t+dur+0.05);
}
function sTone(dur,vol,f0,f1,type,delay){
  if(!AC) return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.05);
}

function makeWhisperBuffer(dur){
  const sr=AC.sampleRate, n=Math.floor(sr*dur);
  const buf=AC.createBuffer(1,n,sr), d=buf.getChannelData(0);
  let i=0;
  while(i<n){
    const syl=Math.floor(sr*rnd(0.07,0.24));
    const gap=Math.floor(sr*(Math.random()<0.16?rnd(0.28,0.6):rnd(0.012,0.05)));
    for(let j=0;j<syl&&i<n;j++,i++){
      const t=j/syl;
      d[i]=(Math.random()*2-1)*Math.min(1,t*9)*Math.pow(1-t,1.15)*rnd(0.55,1);
    }
    i+=gap;
  }
  return buf;
}
function reverseBuffer(buf){
  const out=AC.createBuffer(1,buf.length,AC.sampleRate);
  const s=buf.getChannelData(0), o=out.getChannelData(0);
  for(let i=0;i<s.length;i++) o[i]=s[s.length-1-i];
  return out;
}
const Whisper={
  crowd:[], child:null, pool:[], poolRev:[],
  droneG:null, dawnG:null, rev:false, n:0
};
function voiceChain(buf,f1,f2,pan0){
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const b1=AC.createBiquadFilter(); b1.type='bandpass'; b1.frequency.value=f1; b1.Q.value=8;
  const b2=AC.createBiquadFilter(); b2.type='bandpass'; b2.frequency.value=f2; b2.Q.value=9;
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2400;
  const hpg=AC.createGain(); hpg.gain.value=0.3;
  const g=AC.createGain(); g.gain.value=0.0001;
  const pan=AC.createStereoPanner(); pan.pan.value=pan0||0;
  src.connect(b1); src.connect(b2); src.connect(hp);
  b1.connect(g); b2.connect(g); hp.connect(hpg); hpg.connect(g);
  g.connect(pan); pan.connect(master);
  src.start();
  return {src,b1,b2,g,pan};
}
function initWhisperPool(){
  for(let i=0;i<5;i++) Whisper.pool.push(makeWhisperBuffer(rnd(0.5,1.1)));
  Whisper.poolRev=Whisper.pool.map(b=>reverseBuffer(b));
}
function panFor(x,z){
  const dx=x-player.pos.x, dz=z-player.pos.z;
  const d=Math.max(0.001,Math.hypot(dx,dz));
  const cy=Math.cos(player.yaw), sy=Math.sin(player.yaw);
  return clamp((dx*cy-dz*sy)/d,-1,1);
}
function burstWhisper(x,z,hi,vol){
  if(!AC||infinityMode||depth<7||state!=='playing') return;
  const poolArr=Whisper.rev?Whisper.poolRev:Whisper.pool;
  if(!poolArr.length) return;
  const b=poolArr[rndi(0,poolArr.length-1)];
  const src=AC.createBufferSource(); src.buffer=b;
  const f1=AC.createBiquadFilter(); f1.type='bandpass';
  f1.frequency.value=hi?rnd(500,700):rnd(280,400); f1.Q.value=8;
  const f2=AC.createBiquadFilter(); f2.type='bandpass';
  f2.frequency.value=hi?rnd(1800,2400):rnd(900,1200); f2.Q.value=9;
  const g=AC.createGain();
  const pan=AC.createStereoPanner(); pan.pan.value=panFor(x,z);
  src.connect(f1); src.connect(f2);
  f1.connect(g); f2.connect(g); g.connect(pan); pan.connect(master);
  const t=AC.currentTime;
  g.gain.setValueAtTime(vol,t);
  g.gain.setTargetAtTime(0.0001,t+b.duration*0.7,0.15);
  src.start(t); src.stop(t+b.duration+0.1);
}
function rebuildWhispers(){
  if(!AC) return;
  Whisper.crowd.forEach(v=>{try{v.chain.src.stop();}catch(e){}});
  if(Whisper.child){try{Whisper.child.src.stop();}catch(e){} Whisper.child=null;}
  Whisper.crowd=[];
  let n=0, rev=false;
  if(!infinityMode){
    if(depth>=17){n=3;rev=true;}
    else if(depth>=11) n=3;
    else if(depth>=7) n=1;
  }
  Whisper.n=n; Whisper.rev=rev;
  const forms=[[340,1050],[430,1320],[300,950]];
  for(let i=0;i<n;i++){
    const f=forms[i%3];
    const buf=makeWhisperBuffer(rnd(5,9));
    const chain=voiceChain(rev?reverseBuffer(buf):buf,f[0],f[1],Math.sin(i*2.1)*0.8);
    Whisper.crowd.push({chain,on:false,t:rnd(1,5),
      panA:rnd(0,6),panSpd:rnd(0.04,0.12)*(Math.random()<0.5?-1:1),
      vol:rnd(0.04,0.06),formT:rnd(0.5,2)});
  }
  if(depth>=7&&!infinityMode){
    const buf=makeWhisperBuffer(rnd(6,10));
    Whisper.child=voiceChain(rev?reverseBuffer(buf):buf,650,2250,0);
  }
}
function setAudioMood(inf){
  if(!AC) return;
  if(Whisper.droneG) Whisper.droneG.gain.setTargetAtTime(inf?0.015:0.05,AC.currentTime,0.8);
  if(Whisper.dawnG) Whisper.dawnG.gain.setTargetAtTime(inf?0.045:0.0001,AC.currentTime,0.8);
}
let whisperIdle=0, paral=0;
function updateWhispers(dt){
  if(!AC||!Whisper.n&&!Whisper.child) return;
  const playing=(state==='playing');
  const armorMul=(hasArmor()&&armor>0)?0.45:1;
  for(const v of Whisper.crowd){
    v.t-=dt;
    if(v.t<=0){
      v.on=!v.on;
      v.t=v.on?rnd(1.8,4.5):rnd(2.5,7);
      const target=(v.on&&playing)?v.vol*armorMul:0.0001;
      v.chain.g.gain.setTargetAtTime(target,AC.currentTime,0.6);
    }
    v.panA+=v.panSpd*dt;
    let p=Math.sin(v.panA)*0.85;
    if(paral>0) p*=(1-paral*0.7);
    v.chain.pan.pan.setTargetAtTime(p,AC.currentTime,0.15);
    v.formT-=dt;
    if(v.formT<=0){
      v.formT=rnd(1.2,2.8);
      const f1=rnd(260,760);
      v.chain.b1.frequency.setTargetAtTime(f1,AC.currentTime,0.5);
      v.chain.b2.frequency.setTargetAtTime(f1*rnd(2.0,2.8),AC.currentTime,0.5);
    }
  }
  if(Whisper.child){
    const want=(playing&&!infinityMode&&Whisper.n>0&&paral>0)?paral*0.16:0.0001;
    Whisper.child.g.gain.setTargetAtTime(Math.max(want,0.0001),AC.currentTime,0.5);
  }
}

const cv = renderer.domElement;
document.addEventListener('pointerlockchange',()=>{
  locked = document.pointerLockElement===cv;
  if(locked && pendingState){
    state = pendingState; pendingState=null;
    shiftSeq=0; levelSelectOpen=false;
    overlay.classList.add('hidden');
    document.body.classList.add('playing');
  } else if(!locked && (state==='playing'||state==='transition')){
    if(state==='playing'){ state='paused'; showPause(); }
    laserOff(); moonSound(false);
  }
});

  if(infinityMode) return INFINITY_QUOTES[rndi(0,INFINITY_QUOTES.length-1)];
  if(d>=17) return MOON_QUOTES[rndi(0,MOON_QUOTES.length-1)];

  if(d===7) return '«наступила ночь. и шёпот. шёпот был всегда.»';

}

  platform=p;
  initAudio();
  document.body.classList.toggle('touch', p==='mobile');
  if(p==='mobile'){
    try{ renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); }catch(err){}
    renderer.setSize(innerWidth,innerHeight);
    try{
      if(document.documentElement.requestFullscreen)
        document.documentElement.requestFullscreen().catch(()=>{});
    }catch(err){}
    try{
      if(screen.orientation&&screen.orientation.lock)
        screen.orientation.lock('landscape').catch(()=>{});
    }catch(err){}
  } else {
    try{ renderer.setPixelRatio(Math.min(devicePixelRatio,2)); }catch(err){}
    renderer.setSize(innerWidth,innerHeight);
  }
  const sv=loadSave();
  if(sv){ showContinue(sv); }
  else { startNewRun(); }
}

document.getElementById('overlay').addEventListener('click',e=>{
  initAudio();
  const plat=e.target.closest('.plat-btn[data-plat]');
  if(plat&&state==='menu'){
    choosePlatform(plat.dataset.plat);
    return;
  }
  // продолжение сохранённого сна
  const cb=e.target.closest('[data-cont]');
  if(cb&&state==='continue'){
    if(cb.dataset.cont==='1'){
      const sv=loadSave();
      if(sv){
        depth=sv.d; score=sv.s||0; kills=sv.k||0; deaths=sv.de||0;
        echo=sv.e||0; bestDepth=Math.max(1,sv.b||sv.d); mod=sv.m||null;
        if(sv.inf){ buildInfinityLevel(); }
        else { infinityMode=false; buildLevel(depth); }
        resetPlayer();
        resumeGame();
        return;
      }
    }
    startNewRun();
    return;
  }
  // выбор модификатора после рассвета
  const mb=e.target.closest('.mod-btn');
  if(mb&&state==='modselect'){
    mod=mb.dataset.mod;
    startNewRun();
    return;
  }
  if(e.target.closest('.mod-none')&&state==='modselect'){
    mod=null;
    startNewRun();
    return;
  }
  const btn=e.target.closest('.lvl-btn');
  if(btn&&(state==='paused'||state==='menu')){
    levelSelectOpen=false; shiftSeq=0;
    score=0; kills=0; deaths=0; echo=0;
    if(btn.dataset.inf){
      buildInfinityLevel(); resetPlayer();
    } else {
      infinityMode=false;
      depth=parseInt(btn.dataset.depth,10);
      buildLevel(depth); resetPlayer();
    }
    resumeGame();
    return;
  }
  if(platform==='mobile'&&e.target.closest('h1')&&(state==='paused'||state==='menu')&&!levelSelectOpen){
    const now=performance.now();
    if(now-shiftSeqT>1600) shiftSeq=0;
    shiftSeqT=now;
    if(++shiftSeq>=5){ shiftSeq=0; showLevelSelect(); }
    return;
  }
  if(e.target.closest('.menu-link')&&state==='paused'){
    state='menu';
    laserOff(); moonSound(false);
    enemies.forEach(en=>chargeSound(false,en));
    showIntro();
    return;
  }
  if(levelSelectOpen){
    levelSelectOpen=false;
    if(state==='menu') showIntro(); else showPause();
    return;
  }
  if(state==='menu'){
    return;
  } else if(state==='dead'){
    deaths++;
    buildLevel(depth); resetPlayer();
    resumeGame();
  } else if(state==='dawn'){
    showModSelect();
  } else if(state==='paused'){
    resumeGame();
  }
});

// ---------- лабиринт ----------
function generateMaze(n){
  const W=n*2+1, H=n*2+1;
  const g=Array.from({length:H},()=>new Array(W).fill(1));
  const stack=[[0,0]]; g[1][1]=0;
  while(stack.length){
    const [cx,cy]=stack[stack.length-1];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-0.5);
    let carved=false;
    for(const [dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      if(nx>=0&&ny>=0&&nx<n&&ny<n&&g[ny*2+1][nx*2+1]===1){
        g[cy*2+1+dy][cx*2+1+dx]=0;
        g[ny*2+1][nx*2+1]=0;
        stack.push([nx,ny]); carved=true; break;
      }
    }
    if(!carved) stack.pop();
  }
  let extra=Math.floor(n*n*0.16), guard=900;
  while(extra>0&&guard-->0){
    const x=rndi(1,W-2), y=rndi(1,H-2);
    if(g[y][x]!==1) continue;
    const h=g[y][x-1]===0&&g[y][x+1]===0;
    const v=g[y-1][x]===0&&g[y+1][x]===0;
    if(h!==v){ g[y][x]=0; extra--; }
  }
  return {grid:g,W,H};
}
function isSolid(gx,gz){
  if(infinityMode) return false;
  if(!maze||gx<0||gz<0||gx>=maze.W||gz>=maze.H) return true;
  return maze.grid[gz][gx]===1;
}
function collide(x,z,r){
  const gx0=Math.floor((x-r)/CS), gx1=Math.floor((x+r)/CS);
  const gz0=Math.floor((z-r)/CS), gz1=Math.floor((z+r)/CS);
  for(let gz=gz0;gz<=gz1;gz++)for(let gx=gx0;gx<=gx1;gx++){
    if(!isSolid(gx,gz)) continue;
    const cx=clamp(x,gx*CS,(gx+1)*CS), cz=clamp(z,gz*CS,(gz+1)*CS);
    const dx=x-cx, dz=z-cz;
    if(dx*dx+dz*dz<r*r) return true;
  }
  return false;
}
function moveMC(pos,dx,dz,r){
  if(!collide(pos.x+dx,pos.z,r)) pos.x+=dx;
  if(!collide(pos.x,pos.z+dz,r)) pos.z+=dz;
}
function castWall(ox,oz,dx,dz,maxD){
  let gx=Math.floor(ox/CS), gz=Math.floor(oz/CS);
  const sx=dx>0?1:-1, sz=dz>0?1:-1;
  const tdx=dx!==0?Math.abs(CS/dx):Infinity;
  const tdz=dz!==0?Math.abs(CS/dz):Infinity;
  let tmx=Infinity,tmz=Infinity;
  if(dx>0)tmx=((gx+1)*CS-ox)/dx; else if(dx<0)tmx=(gx*CS-ox)/dx;
  if(dz>0)tmz=((gz+1)*CS-oz)/dz; else if(dz<0)tmz=(gz*CS-oz)/dz;
  let t=0;
  for(let i=0;i<240;i++){
    if(tmx<tmz){ t=tmx; tmx+=tdx; gx+=sx; } else { t=tmz; tmz+=tdz; gz+=sz; }
    if(t>maxD) return maxD;
    if(isSolid(gx,gz)) return t;
  }
  return maxD;
}
function castWall3D(o,d,maxD){
  const l=Math.hypot(d.x,d.z);
  let wall=maxD;
  if(l>1e-4) wall=castWall(o.x,o.z,d.x/l,d.z/l,maxD*l)/l;
  if(d.y<-1e-4){ const tf=o.y/(-d.y); if(tf<wall) wall=tf; }
  return Math.min(wall,maxD);
}
function LOS(ax,az,bx,bz){
  const dx=bx-ax, dz=bz-az, d=Math.hypot(dx,dz);
  if(d<0.001) return true;
  return castWall(ax,az,dx/d,dz/d,d)>=d-0.02;
}
function raySphere(o,d,c,r){
  const ox=o.x-c.x, oy=o.y-c.y, oz=o.z-c.z;
  const b=ox*d.x+oy*d.y+oz*d.z;
  const cc=ox*ox+oy*oy+oz*oz-r*r;
  const disc=b*b-cc;
  if(disc<0) return -1;
  const t=-b-Math.sqrt(disc);
  return t>0?t:-1;
}

const enemies=[], rockets=[], pickups=[], particles=[];
const particleGroup=new THREE.Group(); scene.add(particleGroup);
const eGroup=new THREE.Group(); scene.add(eGroup);

function disposeLevel(){
  moonSound(false); laserOff();
  moonState=null; platforms=[]; dawnRing=null; dawnGlow=null;
  if(!levelGroup) return;
  levelGroup.traverse(o=>{
    if(o.isMesh||o.isPoints){
      if(o.geometry && !SHARED_RES.has(o.geometry)) o.geometry.dispose();
      const mats=Array.isArray(o.material)?o.material:[o.material];
      mats.forEach(m=>{
        if(!m) return;
        if(m.map && !SHARED_RES.has(m.map)) m.map.dispose();
        if(!SHARED_RES.has(m)) m.dispose();
      });
    }
  });
  scene.remove(levelGroup);
  levelGroup=null;
}
function clearEnemiesAndFx(){
  enemies.forEach(e=>chargeSound(false,e)); enemies.length=0;
  rockets.length=0; pickups.length=0;
  for(let i=particles.length-1;i>=0;i--) killParticle(i);
  while(eGroup.children.length){
    const ch=eGroup.children[0];
    ch.traverse(o=>{
      if(o.geometry){
        let shared=false;
        for(const k in ETYPES) if(ETYPES[k].geo===o.geometry){ shared=true; break; }
        if(!shared) o.geometry.dispose();
      }
      if(o.material) o.material.dispose();
    });
    eGroup.remove(ch);
  }
}

      const nx=x+dx,nz=z+dz;
      if(nx<0||nz<0||nx>=maze.W||nz>=maze.H) continue;
      if(maze.grid[nz][nx]===0&&distMap[nz][nx]<0){
        distMap[nz][nx]=distMap[z][x]+1;
        if(distMap[nz][nx]>fd){ fd=distMap[nz][nx]; far=[nx,nz]; }
        q.push([nx,nz]);
      }

  }
  exitPos.set((far[0]+0.5)*CS,0,(far[1]+0.5)*CS);

  const beacon=new THREE.Mesh(
    new THREE.CylinderGeometry(0.9,0.9,90,20,1,true),

      depthWrite:false,fog:false,side:THREE.DoubleSide})

  const ghost=new THREE.Color(0x17140f).lerp(new THREE.Color(0xc7d0e8),NIGHT);

const _m4=new THREE.Matrix4(), _q=new THREE.Quaternion(), _e=new THREE.Euler(),
      _v=new THREE.Vector3(), _s1=new THREE.Vector3(1,1,1), _off=new THREE.Vector3();

function setWallInstance(a,y,tilt){
  const cx=(a.gx+0.5)*CS, cz=(a.gz+0.5)*CS;
  _e.set(tilt*a.tx, 0, tilt*a.tz);
  _q.setFromEuler(_e);
  _off.set(0,WALL_H/2,0).applyQuaternion(_q);
  _v.set(cx+_off.x, _off.y+y, cz+_off.z);
  _m4.compose(_v,_q,_s1);
  wallMesh.setMatrixAt(a.idx,_m4);
  wallMesh.instanceMatrix.needsUpdate=true;
}
function pathOK(sealX,sealZ){
  const W=maze.W,H=maze.H;
  const sx=clamp(Math.floor(player.pos.x/CS),0,W-1);
  const sz=clamp(Math.floor(player.pos.z/CS),0,H-1);
  const ex=Math.floor(exitPos.x/CS), ez=Math.floor(exitPos.z/CS);
  if((sx===sealX&&sz===sealZ)||(ex===sealX&&ez===sealZ)) return false;
  const seen=new Uint8Array(W*H);
  const q=[[sx,sz]]; seen[sz*W+sx]=1;
  while(q.length){
    const [x,z]=q.pop();
    if(x===ex&&z===ez) return true;
    for(const [dx,dz] of DIRS4){
      const nx=x+dx,nz=z+dz;
      if(nx<0||nz<0||nx>=W||nz>=H) continue;
      const id=nz*W+nx;
      if(seen[id]) continue;
      if(maze.grid[nz][nx]===1) continue;
      if(nx===sealX&&nz===sealZ) continue;
      seen[id]=1; q.push([nx,nz]);
    }
  }
  return false;
}
function cellOccupied(gx,gz){
  const test=(x,z,r)=>{
    const cx=clamp(x,gx*CS,(gx+1)*CS), cz=clamp(z,gz*CS,(gz+1)*CS);
    return (x-cx)*(x-cx)+(z-cz)*(z-cz) < r*r;
  };
  if(test(player.pos.x,player.pos.z,PLAYER_R+0.15)) return true;
  for(const e of enemies) if(test(e.center.x,e.center.z,e.r*0.8+0.15)) return true;
  return false;
}
function pushOutOfCell(gx,gz,pos,r){
  const minx=gx*CS, maxx=(gx+1)*CS, minz=gz*CS, maxz=(gz+1)*CS;
  const cx=clamp(pos.x,minx,maxx), cz=clamp(pos.z,minz,maxz);
  const dx=pos.x-cx, dz=pos.z-cz, d2=dx*dx+dz*dz;
  if(d2>r*r) return false;
  if(d2>1e-9){
    const d=Math.sqrt(d2), push=(r-d)/d;
    const nx=pos.x+dx*push, nz=pos.z+dz*push;
    if(!collide(nx,nz,r)){ pos.x=nx; pos.z=nz; return true; }
    pos.x+=dx/d*(r-d+0.05); pos.z+=dz/d*(r-d+0.05);
    return true;
  }
  const cands=[[minx-r-0.03,pos.z],[maxx+r+0.03,pos.z],[pos.x,minz-r-0.03],[pos.x,maxz+r+0.03]];
  for(const [px,pz] of cands) if(!collide(px,pz,r)){ pos.x=px; pos.z=pz; return true; }
  const dl=pos.x-minx, dr=maxx-pos.x, dn=pos.z-minz, df=maxz-pos.z;
  const mn=Math.min(dl,dr,dn,df);
  if(mn===dl) pos.x=minx-r-0.03; else if(mn===dr) pos.x=maxx+r+0.03;
  else if(mn===dn) pos.z=minz-r-0.03; else pos.z=maxz+r+0.03;
  return true;
}
function pickWanderTarget(a){
  const ex=Math.floor(exitPos.x/CS), ez=Math.floor(exitPos.z/CS);
  for(let tries=0;tries<40;tries++){
    const gx=rndi(1,maze.W-2), gz=rndi(1,maze.H-2);
    if(maze.grid[gz][gx]!==0) continue;
    const d=Math.abs(gx-a.gx)+Math.abs(gz-a.gz);
    if(d<3||d>14) continue;
    if(Math.abs(gx-ex)+Math.abs(gz-ez)<2) continue;
    let busy=false;
    for(const o of wallAnim) if(o!==a&&o.gx===gx&&o.gz===gz){busy=true;break;}
    if(busy) continue;
    if(cellOccupied(gx,gz)) continue;
    return [gx,gz];
  }
  return null;
}
function nearVol(a){
  const d=Math.hypot((a.gx+0.5)*CS-player.pos.x,(a.gz+0.5)*CS-player.pos.z);
  return clamp(1-d/30,0.06,1);
}
function nearShake(a,amt){
  const d=Math.hypot((a.gx+0.5)*CS-player.pos.x,(a.gz+0.5)*CS-player.pos.z);
  if(d<16) shake=Math.min(shake+amt*(1-d/16),1.2);
}
function wallDust(a,n){

}
function updateWallAnim(dt){
  if(!wallMesh||!wallAnim.length) return;
  for(const a of wallAnim){
    if(a.state==='gone') continue;
    if(a.state==='wait'){
      a.t-=dt;
      if(a.t<=0){
        a.state='sinking'; a.p=0;
        burstWhisper((a.gx+0.5)*CS,(a.gz+0.5)*CS,false,clamp(nearVol(a)*0.16,0.04,0.16));
        if(Math.random()<0.25){ SFX.rumble(nearVol(a)*0.7); nearShake(a,0.08); }
      }
      continue;
    }
    if(a.state==='up'){
      a.t-=dt;
      if(!a.still) setWallInstance(a,0,Math.sin(gameT*0.8+a.phase)*0.025);
      if(a.t<=0&&!a.frozen){
        a.state='sinking'; a.p=0; a.dur=rnd(1.3,1.9);
        burstWhisper((a.gx+0.5)*CS,(a.gz+0.5)*CS,false,clamp(nearVol(a)*0.2,0.05,0.2));
        SFX.rumble(nearVol(a)); nearShake(a,0.18);
      }
    } else if(a.state==='sinking'){
      a.p+=dt/a.dur;
      const k=easeInOut(Math.min(a.p,1));
      a.y=-SINK_DEPTH*k;
      const tilt=a.tip?0.7*Math.min(k*1.3,1):0;
      setWallInstance(a,a.y,tilt);
      if(a.solid&&a.y<SOLID_Y){ maze.grid[a.gz][a.gx]=0; a.solid=false; wallDust(a,a.mode==='collapse'?5:12); }
      if(a.p>=1){
        a.y=-SINK_DEPTH;
        a.state = a.mode==='collapse' ? 'gone' : 'down';
        a.t=a.mode==='elevator'?rnd(2.2,4):rnd(0.8,1.6);
      }
    } else if(a.state==='down'){
      a.t-=dt;
      if(a.t<=0){
        if(a.mode==='wanderer'){
          const tgt=pickWanderTarget(a);
          if(tgt){ a.gx=tgt[0]; a.gz=tgt[1]; setWallInstance(a,-SINK_DEPTH,0); }
        }
        if(!cellOccupied(a.gx,a.gz)&&pathOK(a.gx,a.gz)){
          a.state='rising'; a.p=0; a.dur=rnd(1.2,1.6); a.pushed=false;
          SFX.rumble(nearVol(a)); nearShake(a,0.18);
        } else a.t=rnd(0.5,1.0);
      }
    } else if(a.state==='rising'){
      a.p+=dt/a.dur;
      const k=easeInOut(Math.min(a.p,1));
      a.y=-SINK_DEPTH*(1-k);
      const tilt=a.tip?0.7*(1-Math.min(k*1.3,1)):0;
      setWallInstance(a,a.y,tilt);
      if(!a.solid&&a.y>SOLID_Y){
        if(pathOK(a.gx,a.gz)){
          maze.grid[a.gz][a.gx]=1; a.solid=true;
          wallDust(a); SFX.thud(nearVol(a)); nearShake(a,0.3);
          if(pushOutOfCell(a.gx,a.gz,player.pos,PLAYER_R+0.05)&&!a.pushed){
            a.pushed=true; damagePlayer(7);
          }
          for(const e of enemies) pushOutOfCell(a.gx,a.gz,e.center,e.r*0.8+0.05);
        } else {
          a.state='sinking'; a.p=1-a.p;
        }
      }
      if(a.p>=1){ a.state='up'; a.t=a.mode==='elevator'?rnd(5,9):rnd(3,6); a.y=0; }
    }
  }
}

const ETYPES={
  TETRA:{geo:new THREE.TetrahedronGeometry(1.05),hp:40, speed:3.6,fireInt:2.7,charge:0.85,dmg:9, range:9, score:10,r:1.0, name:'тетра'},
  OCTA :{geo:new THREE.OctahedronGeometry(1.05), hp:70, speed:2.5,fireInt:2.2,charge:0.85,dmg:13,range:11,score:15,r:1.05,name:'окта'},
  CUBE :{geo:new THREE.BoxGeometry(1.5,1.5,1.5),  hp:140,speed:1.5,fireInt:3.4,charge:1.0, dmg:18,range:8, score:25,r:1.15,name:'куб',
         deep:true, cf0:40, cf1:120},
  ICO  :{geo:new THREE.IcosahedronGeometry(1.1),  hp:100,speed:2.1,fireInt:1.7,charge:0.75,dmg:15,range:13,score:30,r:1.1, name:'икоса'},
  MGUN :{geo:new THREE.CylinderGeometry(0.8,0.8,1.6,6),hp:85,speed:2.0,fireInt:2.6,charge:0.5,dmg:4,range:14,score:20,r:1.05,name:'пулемёт',
         burst:5, burstGap:0.13, cf0:200, cf1:680},
};
function pickType(d){
  const r=Math.random();
  const cube=Math.min(0.08+d*0.04,0.30);
  const ico =d>=2?Math.min(0.05+d*0.03,0.22):0;
  const mgun=d>=3?Math.min(0.07+(d-3)*0.03,0.22):0;
  const octa=Math.min(0.24+d*0.02,0.34);
  if(r<cube) return 'CUBE';
  if(r<cube+ico) return 'ICO';
  if(r<cube+ico+mgun) return 'MGUN';
  if(r<cube+ico+mgun+octa) return 'OCTA';
  return 'TETRA';
}
function spawnEnemy(x,z,d){
  const t=ETYPES[pickType(d)];
  const mat=new THREE.MeshLambertMaterial({color:0x1c0503,emissive:RED,emissiveIntensity:0.5});
  const mesh=new THREE.Mesh(t.geo,mat);
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(t.geo),
    new THREE.LineBasicMaterial({color:0x0d0b09})));
  const aim=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,1,5),
    new THREE.MeshBasicMaterial({color:RED,transparent:true,opacity:0.55,fog:false}));
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1,6),
    new THREE.MeshBasicMaterial({color:0xff2b17,fog:false}));
  aim.visible=false; beam.visible=false;
  scene.add(aim); scene.add(beam);
  eGroup.add(mesh);
  const e={type:t,mesh,aim,beam,center:new THREE.Vector3(x,1.6,z),
    hp:t.hp*(1+(d-1)*0.06), r:t.r,
    flyY:infinityMode?rnd(3,44):1.6,
    state:'hunt', atkT:rnd(1.2,3.5), chargeT:0, beamT:0, loseT:0,
    burstLeft:0, burstT:0,
    aimP:new THREE.Vector3(x,1.2,z), phase:rnd(0,9), spin:rnd(0.6,1.6),
    strafe:Math.random()<0.5?1:-1, strafeT:rnd(1,3), flash:0, spawnT:0.5, osc:null};
  e.center.y=e.flyY;
  mesh.position.copy(e.center);
  mesh.scale.setScalar(0.01);
  enemies.push(e);
  return e;
}
function orientCyl(mesh,a,b){
  const dir=new THREE.Vector3().subVectors(b,a);
  const len=dir.length(); if(len<0.01){mesh.visible=false;return;}
  mesh.scale.set(1,len,1);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
}
function damageEnemy(e,dmg,hitPos){
  e.hp-=dmg; e.flash=1;
  hitmark();
  SFX.hit();
  if(e.hp<=0) killEnemy(e);
  else if(hitPos) sparks(hitPos,6,0xff2b17);
}
function killEnemy(e){
  chargeSound(false,e);
  scene.remove(e.aim); scene.remove(e.beam);
  eGroup.remove(e.mesh);
  enemies.splice(enemies.indexOf(e),1);
  kills++; score+=e.type.score;
  if(depth>=17&&!infinityMode) echo+=e.type.score;
  SFX.kill();
  for(let i=0;i<14;i++){
    const v=new THREE.Vector3(rnd(-4,4),rnd(1,6),rnd(-4,4));
    spawnParticle(e.center,v,rnd(0.5,1.1),0.15,RED,true,1);
  }
  if(!infinityMode&&Math.random()<0.16) spawnPickup(e.center.x,e.center.z);
  updateHUD();
}
function enemyBeam(e,aim,dmg,thick,dur,snd){
  const dir=new THREE.Vector3().subVectors(aim,e.center).normalize();
  const wallD=castWall3D(e.center,dir,60);
  const end=e.center.clone().addScaledVector(dir,wallD);
  orientCyl(e.beam,e.center,end);
  e.beam.scale.x=e.beam.scale.z=thick;
  e.beam.visible=true; e.beamT=dur;
  snd(clamp(1-e.center.distanceTo(player.pos)/45,0.12,0.38));
  sparks(end,4,0xff2b17);
  const rel=new THREE.Vector3().subVectors(player.pos.clone().add(new THREE.Vector3(0,1.1,0)),e.center);
  const proj=rel.dot(dir);
  if(proj>0){
    const perp=rel.sub(dir.clone().multiplyScalar(proj)).length();
    const hitR=thick>1?0.75:0.62;
    if(perp<hitR&&LOS(e.center.x,e.center.z,player.pos.x,player.pos.z)){
      damagePlayer(dmg*(1+(depth-1)*0.04));
    }
  }
}
function updateEnemies(dt){
  const pChest=new THREE.Vector3(player.pos.x,player.pos.y+1.1,player.pos.z);
  for(const e of enemies){
    e.phase+=dt;
    if(e.spawnT>0){ e.spawnT-=dt; e.mesh.scale.setScalar(clamp(1-e.spawnT/0.5,0.01,1)); }
    e.flash=Math.max(0,e.flash-dt*5);
    e.mesh.material.emissiveIntensity=0.5+NIGHT*0.45+e.flash*1.2;
    const dx=player.pos.x-e.center.x, dz=player.pos.z-e.center.z;
    const dist=Math.hypot(dx,dz)||0.001;
    const los=dist<60?LOS(e.center.x,e.center.z,player.pos.x,player.pos.z):false;

    let mvx=0,mvz=0;
    if(e.state==='hunt'){
      e.atkT-=dt;
      e.strafeT-=dt; if(e.strafeT<=0){ e.strafe*=-1; e.strafeT=rnd(1.5,3.5); }
      const nx=dx/dist, nz=dz/dist;
      if(dist>e.type.range){ mvx=nx; mvz=nz; }
      else if(dist<e.type.range*0.5){ mvx=-nx; mvz=-nz; }
      else { mvx=-nz*e.strafe; mvz=nx*e.strafe; }
      if(e.atkT<=0&&los&&dist<27&&e.spawnT<=0){
        e.state='charge'; e.chargeT=e.type.charge; e.loseT=0;
        e.aimP.copy(pChest);
        chargeSound(true,e,e.type.charge,e.type.cf0,e.type.cf1);
        burstWhisper(e.center.x,e.center.z,true,clamp(1-dist/28,0.08,0.22));
      }
    } else if(e.state==='charge'){
      e.aimP.lerp(pChest,1-Math.exp(-4.5*dt));
      e.chargeT-=dt;
      if(!los){ e.loseT+=dt; if(e.loseT>0.25){ e.state='hunt'; e.atkT=0.7; chargeSound(false,e); e.aim.visible=false; } }
      else e.loseT=0;
      e.aim.visible=los;
      if(los) orientCyl(e.aim,e.center,e.aimP);
      if(e.chargeT<=0&&e.state==='charge'){
        chargeSound(false,e); e.aim.visible=false;
        if(e.type.burst){
          e.state='burst'; e.burstLeft=e.type.burst; e.burstT=0.05;
        } else {
          e.state='hunt'; e.atkT=e.type.fireInt*rnd(0.85,1.3);
          enemyBeam(e,e.aimP,e.type.dmg,e.type.deep?2.2:1,0.12,
            v=>e.type.deep?SFX.zapTank(v):SFX.zap(v));
        }
      }
      mvx=dx/dist*0.15; mvz=dz/dist*0.15;
    } else if(e.state==='burst'){
      e.aimP.lerp(pChest,1-Math.exp(-1.6*dt));
      if(!los){ e.state='hunt'; e.atkT=0.6; }
      else{
        e.burstT-=dt;
        if(e.burstT<=0&&e.burstLeft>0){
          e.burstLeft--; e.burstT=e.type.burstGap;
          const t=e.aimP.clone(), sp=0.5;
          t.x+=rnd(-sp,sp); t.y+=rnd(-sp*0.4,sp*0.4); t.z+=rnd(-sp,sp);
          enemyBeam(e,t,e.type.dmg,0.5,0.07,v=>SFX.mgun(v));
          if(e.burstLeft<=0){ e.state='hunt'; e.atkT=e.type.fireInt*rnd(0.85,1.2); }
        }
      }
      const nx=dx/dist,nz=dz/dist;
      mvx=-nz*e.strafe*0.45; mvz=nx*e.strafe*0.45;
    }
    if(e.beamT>0){ e.beamT-=dt; if(e.beamT<=0) e.beam.visible=false; }

    const sp=e.type.speed*(e.state==='charge'?0.3:e.state==='burst'?0.5:1);
    moveMC(e.center,mvx*sp*dt,mvz*sp*dt,e.r*0.8);
    for(const o of enemies){ if(o===e) continue;
      const ox=e.center.x-o.center.x, oz=e.center.z-o.center.z;
      const d2=ox*ox+oz*oz, rr=(e.r+o.r)*0.9;
      if(d2>0.001&&d2<rr*rr){ const d=Math.sqrt(d2),push=(rr-d)*0.5;
        e.center.x+=ox/d*push*dt*8; e.center.z+=oz/d*push*dt*8; }
    }
    e.center.y=e.flyY+Math.sin(e.phase*1.4)*0.25;
    e.mesh.position.copy(e.center);
    e.mesh.rotation.y+=e.spin*dt;
    e.mesh.rotation.x=Math.sin(e.phase*0.7)*0.15;
  }
}

function updateMoon(dt){
  const m=moonState;
  if(!m) return;
  m.orbitA+=dt*0.05;
  m.pos.set(m.cx+Math.cos(m.orbitA)*90, 100, m.cz+Math.sin(m.orbitA)*90);
  m.disc.position.copy(m.pos);   m.disc.quaternion.copy(camera.quaternion);
  m.halo.position.copy(m.pos);   m.halo.quaternion.copy(camera.quaternion);
  m.halo.rotation.z+=dt*0.4;

  if(m.state==='idle'){
    m.t-=dt;
    if(m.t<=0){
      m.state='tele'; m.teleT=MOON_TELE;
      m.aim.set(player.pos.x,0,player.pos.z);
      m.ring.visible=true; m.line.visible=true;
      moonSound(true);
      burstWhisper(m.pos.x,m.pos.z,true,0.22);
    }
  } else if(m.state==='tele'){
    m.teleT-=dt;
    m.aim.lerp(_v.set(player.pos.x,0,player.pos.z),1-Math.exp(-2.0*dt));
    m.ring.position.set(m.aim.x,0.1,m.aim.z);
    const pr=1-m.teleT/MOON_TELE;
    m.ring.scale.setScalar(2.6*(1.15-0.4*pr));
    m.ring.material.opacity=0.35+0.45*Math.abs(Math.sin(gameT*14));
    orientCyl(m.line,m.pos,_v.set(m.aim.x,0.1,m.aim.z));
    m.line.material.opacity=0.2+0.3*Math.abs(Math.sin(gameT*16));
    if(m.teleT<=0){
      m.state='fire'; m.fireT=0.4;
      moonSound(false);
      SFX.boom(); SFX.zap(0.5);
      m.beam.visible=true; m.ring.visible=false; m.line.visible=false;
      orientCyl(m.beam,m.pos,_v.set(m.aim.x,0,m.aim.z));
      m.beam.scale.x=m.beam.scale.z=1.3;
      const dd=Math.hypot(player.pos.x-m.aim.x,player.pos.z-m.aim.z);
      if(dd<MOON_RADIUS&&LOS(m.aim.x,m.aim.z,player.pos.x,player.pos.z))
        damagePlayer(MOON_DMG);
      for(let i=0;i<20;i++){
        const v=new THREE.Vector3(rnd(-7,7),rnd(1,9),rnd(-7,7));
        spawnParticle(_v.set(m.aim.x,0.3,m.aim.z),v,rnd(0.4,0.9),rnd(0.08,0.2),
          Math.random()<0.5?RED:0xff5a3a,true,1);
      }
      boomLight.position.set(m.aim.x,1.5,m.aim.z); boomLight.intensity=6;
      shake=Math.min(shake+0.7,1.3);
    }
  } else if(m.state==='fire'){
    m.fireT-=dt;
    m.beam.material.opacity=Math.max(0.15,m.fireT/0.4);
    if(m.fireT<=0){
      m.beam.visible=false;
      m.state='idle';
      m.t=clamp(4.4-(depth-17)*0.35,2.0,4.4)*rnd(0.85,1.2);
    }
  }
}

const _dyTmp=new THREE.Vector3();
function updateDyson(dt){
  if(!hasArmor()){ dysonGroup.visible=false; return; }
  dysonGroup.visible=true;
  dysonGroup.position.lerp(_dyTmp.set(player.pos.x,player.pos.y+1.05,player.pos.z),1-Math.exp(-7*dt));

  const dead=armor<=0;
  const mul=dead?0.15:1;
  dysonR1.rotation.x+=dt*1.6*mul;
  dysonR2.rotation.y+=dt*2.3*mul;
  dysonR3.rotation.z+=dt*1.1*mul;
  dysonOrbs.rotation.y+=dt*2.7*mul;
  dysonOrbs.rotation.x=Math.sin(gameT*0.8)*0.3;

  dysonGroup.scale.setScalar(sc);
  const op=dead?0.1:(0.5+armorFlash*0.5);
  [dysonR1,dysonR2,dysonR3].forEach(r=>r.material.opacity=op);
}

// ---------- урон ----------
function damagePlayer(dmg,pierce){
  if(state!=='playing'||infinityMode) return;
  if(hasArmor()&&!pierce&&armor>0){
    const ab=Math.min(armor,dmg);
    armor-=ab; dmg-=ab;
    armorFlash=1;
    SFX.shield();
    if(dmg<=0){ player.lastHurt=gameT; updateHUD(); return; }
  }
  player.hp-=dmg; player.lastHurt=gameT;
  dmgFlash=1; shake=Math.min(shake+0.5,1);
  SFX.hurt();
  if(player.hp<=0){ player.hp=0; die(); }
  updateHUD();
}
function die(){
  state='dead';
  bestDepth=Math.max(bestDepth,depth);
  enemies.forEach(e=>chargeSound(false,e));
  laserOff(); moonSound(false);
  document.exitPointerLock&&document.exitPointerLock();
  showDeath();
}

// материалы оружия — обычные, с depth-тестом:
// корректное взаимное перекрытие деталей даёт второй проход рендера
function vmMat(c,e){ const m=new THREE.MeshLambertMaterial({color:c});
  if(e)m.emissive=new THREE.Color(e),m.emissiveIntensity=0.7;
  return m; }
const M_DARK=vmMat(0x141210), M_LIGHT=vmMat(0xe6dfd0), M_WOOD=vmMat(0x5a4130),
      M_RED=vmMat(0x8a1207,0xe02414), M_CORE=vmMat(0x5a0d05,0xff2b17);
function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); }
function cyl(r,h,mat,seg){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg||12),mat);
  m.rotation.x=Math.PI/2; return m; }

function buildRevolver(){
  const g=new THREE.Group();
  const f=box(0.07,0.13,0.36,M_DARK); f.position.set(0,0.02,-0.12); g.add(f);
  const b=cyl(0.034,0.36,M_DARK); b.position.set(0,0.045,-0.44); g.add(b);
  const drum=new THREE.Group();
  const dc=cyl(0.075,0.17,M_LIGHT); drum.add(dc);
  for(let i=0;i<6;i++){ const hole=cyl(0.018,0.19,M_DARK);

function hitscan(o,d,dmg){
  const maxD=200;
  const wallD=castWall3D(o,d,maxD);
  let best=null,bt=wallD;
  for(const e of enemies){
    const t=raySphere(o,d,e.center,e.r*1.05);
    if(t>0&&t<bt){ bt=t; best=e; }
  }
  const hitP=o.clone().addScaledVector(d,bt);
  if(best) damageEnemy(best,dmg,hitP);
  else if(bt<maxD) sparks(hitP,3,0x2a241c);
}
function fireLaserTick(){

}

function explode(pos){
  SFX.boom();
  boomLight.position.copy(pos); boomLight.intensity=7;
  shake=Math.min(shake+0.6,1.2);
  for(let i=0;i<26;i++){
    const v=new THREE.Vector3(rnd(-8,8),rnd(-2,10),rnd(-8,8));

  }

      new THREE.Vector3(rnd(-0.5,0.5),rnd(0.5,1.5),rnd(-0.5,0.5)),
      rnd(0.8,1.4),0.5,0x6b6355,false,2.4);
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i], d=e.center.distanceTo(pos);
    if(d<4.6) damageEnemy(e,130*(1-d/4.6));
  }
  const pd=camera.position.distanceTo(pos);
  if(pd<4.6){
    damagePlayer(55*(1-pd/4.6));
    const push=new THREE.Vector3().subVectors(camera.position,pos).normalize().multiplyScalar(9);
    player.vel.add(push);
    player.vel.y=Math.max(player.vel.y,4);
  }

function updateRockets(dt){
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.pos.addScaledVector(r.vel,dt); r.dist+=r.vel.length()*dt;
    r.mesh.position.copy(r.pos);
    spawnParticle(r.pos.clone(),new THREE.Vector3(rnd(-0.3,0.3),rnd(0.3,0.8),rnd(-0.3,0.3)),
      rnd(0.4,0.7),0.14,0x8d8574,false,1.8);
    let hit=r.dist>130||r.pos.y<0.15||collide(r.pos.x,r.pos.z,0.1);
    if(!hit) for(const e of enemies)
      if(e.center.distanceTo(r.pos)<e.r+0.35){hit=true;break;}
    if(hit){
      scene.remove(r.mesh);
      r.mesh.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); });
      rockets.splice(i,1); explode(r.pos.clone());
    }
  }
}

const partGeo=new THREE.TetrahedronGeometry(1);
function spawnParticle(pos,vel,life,size,color,grav,mul){
  if(particles.length>340) return;
  const mat=new THREE.MeshBasicMaterial({color,transparent:true});
  const m=new THREE.Mesh(partGeo,mat);
  m.position.copy(pos); m.scale.setScalar(size);
  particleGroup.add(m);
  particles.push({m,vel,life,max:life,grav:grav?GRAV*(mul||1):0,
    spin:new THREE.Vector3(rnd(-5,5),rnd(-5,5),rnd(-5,5)),grow:grav?0:(mul||1)});
}
function killParticle(i){
  particleGroup.remove(particles[i].m);
  particles[i].m.material.dispose();
  particles.splice(i,1);
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){ killParticle(i); continue; }
    p.vel.y-=p.grav*dt;
    p.m.position.addScaledVector(p.vel,dt);
    if(p.m.position.y<0.03&&p.grav){ p.m.position.y=0.03; p.vel.y*=-0.35; p.vel.x*=0.6; p.vel.z*=0.6; }
    p.m.rotation.x+=p.spin.x*dt; p.m.rotation.y+=p.spin.y*dt;
    const k=p.life/p.max;
    p.m.material.opacity=p.grow?k:Math.min(1,k*2);
    if(p.grow>1) p.m.scale.multiplyScalar(1+p.grow*dt*0.6);
  }
}
function sparks(pos,n,color){
  for(let i=0;i<n;i++){
    const v=new THREE.Vector3(rnd(-3,3),rnd(0,4),rnd(-3,3));

}

function knobTo(base,knob,cx,cy){
  const r=base.getBoundingClientRect();
  let dx=cx-(r.left+r.width/2), dy=cy-(r.top+r.height/2);
  const max=r.width/2-30;
  const d=Math.hypot(dx,dy);
  if(d>max){ dx=dx/d*max; dy=dy/d*max; }
  knob.style.transform=`translate(${dx}px,${dy}px)`;
}

    touchUI.lookId=e.pointerId; lx=e.clientX; ly=e.clientY;
    try{lookEl.setPointerCapture(e.pointerId);}catch(err){}
    knobTo(lookEl,kl,e.clientX,e.clientY);
    e.preventDefault();
  });
  lookEl.addEventListener('pointermove',e=>{
    if(e.pointerId!==touchUI.lookId) return;
    const dx=e.clientX-lx, dy=e.clientY-ly;
    lx=e.clientX; ly=e.clientY;
    if(state==='playing'){
      player.yaw-=dx*TOUCH_SENS;
      player.pitch=clamp(player.pitch-dy*TOUCH_SENS,-1.5,1.5);
    }
    knobTo(lookEl,kl,e.clientX,e.clientY);
  });
  const lookEnd=e=>{
    if(e.pointerId===touchUI.lookId){
      touchUI.lookId=null; kl.style.transform='';
    }
  };
  lookEl.addEventListener('pointerup',lookEnd);
  lookEl.addEventListener('pointercancel',lookEnd);

  function setMove(cx,cy){
    const r=moveEl.getBoundingClientRect();
    let dx=(cx-(r.left+r.width/2))/(r.width/2);
    let dy=(cy-(r.top+r.height/2))/(r.height/2);
    const d=Math.hypot(dx,dy);
    if(d>1){ dx/=d; dy/=d; }
    const dz=0.16, m=Math.hypot(dx,dy);
    if(m<dz){ dx=0; dy=0; }
    else{
      const sc=(m-dz)/(1-dz);
      dx=dx/m*sc; dy=dy/m*sc;
    }
    touchUI.moveX=dx; touchUI.moveY=-dy;
    knobTo(moveEl,km,cx,cy);
  }
  moveEl.addEventListener('pointerdown',e=>{
    if(touchUI.moveId!==null) return;
    touchUI.moveId=e.pointerId;
    try{moveEl.setPointerCapture(e.pointerId);}catch(err){}
    setMove(e.clientX,e.clientY);
    e.preventDefault();
  });
  moveEl.addEventListener('pointermove',e=>{
    if(e.pointerId===touchUI.moveId) setMove(e.clientX,e.clientY);
  });
  const moveEnd=e=>{
    if(e.pointerId===touchUI.moveId){
      touchUI.moveId=null; touchUI.moveX=0; touchUI.moveY=0;
      km.style.transform='';
    }
  };
  moveEl.addEventListener('pointerup',moveEnd);
  moveEl.addEventListener('pointercancel',moveEnd);

  const fire=$('t-fire');
  fire.addEventListener('pointerdown',e=>{
    touchUI.fireHeld=true; touchUI.fireBlocked=false;
    fire.classList.add('on');
    try{fire.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  const fireEnd=()=>{
    touchUI.fireHeld=false; touchUI.fireBlocked=false; laserHeld=false;
    fire.classList.remove('on');
  };
  fire.addEventListener('pointerup',fireEnd);
  fire.addEventListener('pointercancel',fireEnd);

  const jump=$('t-jump');
  jump.addEventListener('pointerdown',e=>{
    touchUI.jumpHeld=true;
    try{jump.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  jump.addEventListener('pointerup',()=>touchUI.jumpHeld=false);
  jump.addEventListener('pointercancel',()=>touchUI.jumpHeld=false);

  $('t-pause').addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(state==='playing'){
      state='paused'; showPause(); laserOff(); moonSound(false);
    }
  });
  $('t-reload').addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(state==='playing') startReload();
  });
  for(let i=0;i<5;i++){
    $('t-w'+(i+1)).addEventListener('pointerdown',e=>{
      e.preventDefault();
      if(state==='playing') switchWeapon(i);
    });
  }
})();
addEventListener('contextmenu',e=>{ if(platform==='mobile') e.preventDefault(); });
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

// ---------- главный цикл ----------
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);

  sunGroup.position.copy(camera.position).addScaledVector(SUNDIR,340);
  sunGroup.quaternion.copy(camera.quaternion);
  updateBeaconHum(dt);
  updateWhispers(dt);

  if(state==='playing'){
    gameT+=dt;

    // --- движение: клавиатура + сенсорный пад ---
    let f=0,s=0;
    if(keys['KeyW']||keys['ArrowUp'])f++;
    if(keys['KeyS']||keys['ArrowDown'])f--;
    if(keys['KeyD']||keys['ArrowRight'])s++;
    if(keys['KeyA']||keys['ArrowLeft'])s--;
    f+=touchUI.moveY; s+=touchUI.moveX;
    const running=((keys['ShiftLeft']||keys['ShiftRight'])&&f>0)
      ||(platform==='mobile'&&touchUI.moveY>0.92);
    const speed=running?curRun:curWalk;
    const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
    let wx=(-sy*f+cy*s), wz=(-cy*f-sy*s);
    const wl=Math.hypot(wx,wz); if(wl>0){wx/=wl;wz/=wl;}
    const k=1-Math.exp(-11*dt);
    player.vel.x+=(wx*speed-player.vel.x)*k;
    player.vel.z+=(wz*speed-player.vel.z)*k;
    if((keys['Space']||touchUI.jumpHeld)&&player.onGround){
      player.vel.y=curJump; player.onGround=false;
    }
    player.vel.y-=curGrav*dt;
    moveMC(player.pos,player.vel.x*dt,player.vel.z*dt,PLAYER_R);
    player.pos.y+=player.vel.y*dt;

    // --- вертикаль: пол + фигуры-платформы (рассвет) ---
    let floorY=0;
    if(infinityMode){
      for(let i=0;i<platforms.length;i++){
        const p=platforms[i];
        const dx=player.pos.x-p.x, dz=player.pos.z-p.z;
        if(dx*dx+dz*dz<=p.r*p.r && p.y<=player.pos.y+0.35 && p.y>floorY)
          floorY=p.y;
      }
    }
    if(player.pos.y<=floorY){
      player.pos.y=floorY; player.vel.y=0; player.onGround=true;
    } else player.onGround=false;

    updateWallAnim(dt);

    const spxz=Math.hypot(player.vel.x,player.vel.z);
    if(player.onGround&&spxz>1){
      player.bob+=spxz*dt*1.7;
      player.stepAcc+=spxz*dt;
      if(player.stepAcc>2.6){ player.stepAcc=0; SFX.step(); }
    }
    if(!infinityMode&&depth>=7&&spxz<0.6&&player.onGround) whisperIdle+=dt;
    else whisperIdle=0;
    paral=clamp((whisperIdle-2.2)/4,0,1);
    if(!infinityMode){
      if(gameT-player.lastHurt>5&&player.hp<100)
        player.hp=Math.min(100,player.hp+4.5*dt);
      if(hasArmor()&&armor<100&&gameT-player.lastHurt>ARMOR_DELAY)
        armor=Math.min(100,armor+ARMOR_REGEN*dt);
    }

    // --- камера ---
    camera.position.set(player.pos.x,player.pos.y+EYE,player.pos.z);
    camera.rotation.set(player.pitch,player.yaw,0);
    if(shake>0.002){
      camera.rotation.x+=rnd(-1,1)*shake*0.035;
      camera.rotation.y+=rnd(-1,1)*shake*0.035;
      camera.rotation.z+=rnd(-1,1)*shake*0.02;
      shake*=Math.exp(-6*dt);
    }
    const baseFov=infinityMode?80:75;
    const targetFov=baseFov+(running?5:0);
    if(Math.abs(camera.fov-targetFov)>0.1){
      camera.fov+=(targetFov-camera.fov)*Math.min(1,10*dt);
      camera.updateProjectionMatrix();
    }

    // --- фонарь ---
    if(playerLightBase>0){
      playerLight.intensity=playerLightBase*
        (0.93+0.05*Math.sin(gameT*6.1)+0.03*Math.sin(gameT*15.7));
    } else playerLight.intensity=0;

    // --- автоогонь АК: удержание ЛКМ ---
    if(mouseHeld&&WEAPONS[curW].auto&&!infinityMode) tryFire();
    // --- сенсорный огонь: удержание = автоогонь / луч ---
    if(platform==='mobile'&&touchUI.fireHeld){
      const fw=WEAPONS[curW];
      if(fw.laser){ if(!touchUI.fireBlocked) laserHeld=true; }
      else tryFire();
    }

    // --- view-model ---
    recoil*=Math.exp(-9*dt);
    if(switchT>0) switchT-=dt;
    const gm=gunModels[curW], st=gunState[curW];
    let rp=0;
    if(st.reloading>0){
      st.reloading-=dt;
      const pr=1-st.reloading/WEAPONS[curW].reload;
      rp=-Math.sin(pr*Math.PI)*0.9;
      if(st.reloading<=0){ st.ammo=WEAPONS[curW].mag; SFX.click(); updateHUD(); }
    }
    const sw=switchT>0?switchT/0.4:0;
    const amp=gm.userData.bobAmp*Math.min(1,spxz/curWalk);
    const laserActiveNow = curW===3&&hasLaser()&&laserHeld&&(infinityMode||mod==='beam'||player.hp>LASER_MIN_HP);
    gunRig.position.set(
      GUN_BASE.x+Math.sin(player.bob)*amp,
      GUN_BASE.y-Math.abs(Math.cos(player.bob))*amp*1.4-sw*0.55+rp*0.18,
      GUN_BASE.z+recoil*0.24+(laserActiveNow?Math.sin(gameT*50)*0.004:0)
    );
    gunRig.rotation.set(rp+recoil*0.35,0,recoil*0.06);
    flashLight.intensity*=Math.exp(-26*dt);
    if(flashLight.intensity<0.02)flashLight.intensity=0;
    boomLight.intensity*=Math.exp(-8*dt);

    // --- лазер игрока ---
    if(laserActiveNow){
      if(!laserOn){ laserOn=true; laserSound(true); laserBeam.visible=true; laserTickT=0; }
      laserTickT-=dt;
      if(laserTickT<=0){ laserTickT=LASER_TICK; fireLaserTick(); }
      if(laserOn) updateLaserBeam();
    } else if(laserOn){ laserOff(); }

    // --- рассвет: толпа не редеет ---
    if(infinityMode){
      infSpawnT-=dt;
      if(enemies.length<INF_ENEMIES&&infSpawnT<=0){
        infSpawnT=0.9;
        const ang=rnd(0,Math.PI*2), rr=rnd(26,64);
        const ne=spawnEnemy(player.pos.x+Math.cos(ang)*rr, player.pos.z+Math.sin(ang)*rr, 17);
        ne.flyY=clamp(player.pos.y+rnd(-10,14),2.5,52);
        ne.center.y=ne.flyY;
      }
    }

    updateEnemies(dt);
    updateRockets(dt);
    updateParticles(dt);
    updatePickups(dt);
    updateMoon(dt);
    updateDyson(dt);

    // маяк
    if(levelGroup){
      const b=levelGroup.userData.beacon;
      b.material.opacity=0.18+Math.sin(gameT*2.2)*0.07;
      const r=levelGroup.userData.ring;
      r.scale.setScalar(1+Math.sin(gameT*2.2)*0.12);
      r.rotation.z+=dt*0.8;
    }
    if(levelGroup) for(const o of levelGroup.children)
      if(o.userData.sky){ o.rotation.y+=o.userData.spin*dt; o.rotation.x+=o.userData.spin*0.4*dt; }
    if(starfield) starfield.rotation.y+=0.005*dt;
    if(dawnRing){
      dawnRing.material.opacity=0.75+0.15*Math.sin(gameT*0.7);
      dawnGlow.material.opacity=0.2+0.07*Math.sin(gameT*0.5+1);
    }

    // --- выход: три судьбы луча ---
    const reached = Math.hypot(player.pos.x-exitPos.x,player.pos.z-exitPos.z)<1.6
      && Math.abs(player.pos.y-exitPos.y)<2.5;
    if(reached){
      if(infinityMode){
        SFX.portal();
        showDawn();
      } else {
        state='transition';
        laserOff();
        SFX.portal();
        const gained=score-scoreAtLevelStart;
        score+=100*depth;
        if(depth>=17&&echo>=ECHO_GOAL){
          showInfinityTransition();
          setTimeout(()=>{
            if(state!=='transition') return;
            buildInfinityLevel(); resetPlayer();
            if(platform==='mobile'||locked){ state='playing'; }
            else { state='paused'; showPause(); }
            document.getElementById('overlay').classList.add('hidden');
          },1900);
        } else if(depth>=24&&gained<=LOOP_MIN){
          showLoopTransition();
          setTimeout(()=>{
            if(state!=='transition') return;
            buildLevel(depth); resetPlayer();
            if(platform==='mobile'||locked){ state='playing'; }
            else { state='paused'; showPause(); }
            document.getElementById('overlay').classList.add('hidden');
          },1700);
        } else {
          const nextD=depth+1;
          depth++; bestDepth=Math.max(bestDepth,depth);
          player.hp=Math.min(100,player.hp+35);
          showTransition(nextD);
          setTimeout(()=>{
            if(state!=='transition') return;
            buildLevel(depth); resetPlayer();
            if(platform==='mobile'||locked){ state='playing'; }
            else { state='paused'; showPause(); }
            document.getElementById('overlay').classList.add('hidden');
          },1500);
        }
      }
    }

    if(dmgFlash>0){ dmgFlash-=dt*2.2; $('damage').style.opacity=Math.max(0,dmgFlash); }
    else $('damage').style.opacity=0;

    if(cooldown>0) cooldown-=dt;
    updateHUD();
  }
  else if(state==='transition'||state==='dead'||state==='dawn'){
    updateParticles(dt);
    updateDyson(dt);
  }

  /* ---------- рендер в два прохода ----------
     1) мир · 2) depth очищается → оружие поверх стен,
     но с честным depth-тестом между собственными деталями */
  renderer.autoClear=true;
  renderer.render(scene,camera);
  renderer.autoClear=false;
  renderer.clearDepth();
  if(gunCamera.fov!==camera.fov){
    gunCamera.fov=camera.fov;
    gunCamera.updateProjectionMatrix();
  }
  renderer.render(gunScene,gunCamera);
  renderer.autoClear=true;
}
loop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  gunCamera.aspect=innerWidth/innerHeight;
  gunCamera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
addEventListener('orientationchange',()=>setTimeout(()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  gunCamera.aspect=innerWidth/innerHeight;
  gunCamera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
},250));
</script>
